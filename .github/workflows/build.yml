                --bg-dark: #0d1117;
                --header-bg: #161b22;
                --green-card: #0b2419;
                --green-banner: #143d29;
                --green-border: #2ea043;
                --green-bright: #3fb950;
                --red-card: #260c10;
                --red-banner: #42141b;
                --red-border: #da3633;
                --red-bright: #ff7b72;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
              body { background: var(--bg-dark); color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

              .topbar {
                background: var(--header-bg); padding: 10px 18px; display: flex; align-items: center;
                justify-content: space-between; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100; flex-wrap: wrap; gap: 8px;
              }
              .brand { display: flex; align-items: center; gap: 10px; }
              .brand img { width: 30px; height: 30px; }
              .brand h1 { font-size: 19px; font-weight: 800; color: #ffffff; }
              .brand span { font-size: 12px; color: #8b949e; }
              .top-actions { display: flex; align-items: center; gap: 6px; position: relative; flex-wrap: wrap; }

              .btn {
                border: none; border-radius: 7px; padding: 8px 12px; font-size: 12px; font-weight: 700;
                cursor: pointer; color: #ffffff; transition: opacity 0.15s, transform 0.1s;
                display: inline-flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none;
              }
              .btn:hover { opacity: 0.92; }
              .btn:active { transform: scale(0.98); }
              .btn:disabled { opacity: 0.5; cursor: not-allowed; }
              .btn-blue { background: #1f6feb; }
              .btn-gold { background: #9e6a03; border: 1px solid #d29922; color: #fff; }
              .btn-dark { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; }
