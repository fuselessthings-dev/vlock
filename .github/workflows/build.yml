                  const enc = new TextEncoder();
                  const dotIdx = selectedRawMediaFile.name.lastIndexOf('.');
                  const ext = (dotIdx >= 0 ? selectedRawMediaFile.name.slice(dotIdx).toLowerCase() : '.mp4').slice(0, 16);
                  const stem = dotIdx > 0 ? selectedRawMediaFile.name.slice(0, dotIdx) : selectedRawMediaFile.name;

                  const extBytes16 = new Uint8Array(16);
                  extBytes16.set(enc.encode(ext).slice(0, 16), 0);

                  const masterKey = crypto.getRandomValues(new Uint8Array(32));
                  const nonce8 = crypto.getRandomValues(new Uint8Array(8));
                  const verifyHash = await sha256Bytes(concatBytes(masterKey, enc.encode("VLOCK_VERIFY")));

                  const totalSlots = numTempKeys + (includePerm ? 1 : 0);
                  const slotsBuffer = new Uint8Array(totalSlots * SLOT_SIZE);
                  const keyLines = [];
                  let slotIdx = 0;

                  if (includePerm) {
                    const pkStr = generateHumanKey("VLOCK-MASTER");
                    keyLines.push("=== PERMANENT MASTERKEY (UNLOCKS FOREVER & RESTORES ORIGINAL VIDEO) ===", pkStr, "");
                    const pkBytes = enc.encode(pkStr);
                    const pkId = (await sha256Bytes(pkBytes)).slice(0, 15);
                    const pkMask = await sha256Bytes(concatBytes(pkBytes, enc.encode("VLOCK_WRAP")));
                    const off = slotIdx * SLOT_SIZE;
                    slotsBuffer[off] = 2;
                    slotsBuffer.set(pkId, off + 1);
                    for (let b = 0; b < 32; b++) slotsBuffer[off + 16 + b] = masterKey[b] ^ pkMask[b];
                    slotIdx++;
                  }

                  if (numTempKeys > 0) {
                    if (includePerm) keyLines.push(`=== ONE-TIME TEMPORARY KEYS (${numTempKeys}) ===`);
                    for (let i = 0; i < numTempKeys; i++) {
                      const kStr = generateHumanKey("VLOCK");
                      keyLines.push(kStr);
                      const kBytes = enc.encode(kStr);
                      const kId = (await sha256Bytes(kBytes)).slice(0, 15);
                      const kMask = await sha256Bytes(concatBytes(kBytes, enc.encode("VLOCK_WRAP")));
                      const off = slotIdx * SLOT_SIZE;
                      slotsBuffer[off] = 1;
                      slotsBuffer.set(kId, off + 1);
                      for (let b = 0; b < 32; b++) slotsBuffer[off + 16 + b] = masterKey[b] ^ kMask[b];
                      slotIdx++;
                    }
                  }

                  // DISPLAY & SAVE BOT_KEYS.TXT IMMEDIATELY
                  lastGeneratedKeysContent = keyLines.join('\n') + '\n';
                  document.getElementById('keysTextarea').value = lastGeneratedKeysContent;
                  document.getElementById('keysOutputBox').classList.add('show');
                  await saveBlobToDisk(new Blob([lastGeneratedKeysContent], { type: 'text/plain;charset=utf-8' }), 'bot_keys.txt');

                  // ENCRYPT VIDEO LOCALLY IN 8MB DISK-BACKED CHUNKS (0 MB INTERNET UPLOAD)
                  const headerFixed = new Uint8Array(66);
                  headerFixed.set(enc.encode("VLCK"), 0);
                  const hDv = new DataView(headerFixed.buffer);
                  hDv.setUint16(4, 2, false);
                  headerFixed.set(extBytes16, 6);
                  headerFixed.set(nonce8, 22);
                  headerFixed.set(verifyHash, 30);
                  hDv.setUint32(62, totalSlots, false);

                  const cryptoKey = await crypto.subtle.importKey('raw', masterKey, 'AES-CTR', false, ['encrypt']);
                  const blobParts = [new Blob([headerFixed]), new Blob([slotsBuffer])];

                  const chunkSize = 8 * 1024 * 1024;
                  const totalSize = selectedRawMediaFile.size;
                  let offset = 0;

                  while (offset < totalSize) {
                    const len = Math.min(chunkSize, totalSize - offset);
                    const plainSlice = await selectedRawMediaFile.slice(offset, offset + len).arrayBuffer();
                    const encSlice = await crypto.subtle.encrypt(
                      { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                      cryptoKey,
                      plainSlice
                    );
                    blobParts.push(new Blob([encSlice]));
                    offset += len;
                    const pct = Math.min(100, Math.round((offset / totalSize) * 100));
                    progEl.style.width = pct + '%';
                    statusEl.textContent = `Step 2/2: Encrypting locally on device... ${pct}% (0 MB internet used)`;
                  }

                  await saveBlobToDisk(new Blob(blobParts, { type: 'application/octet-stream' }), `${stem}.vlock`);
                  statusEl.textContent = `Done! Saved ${stem}.vlock & bot_keys.txt to your device.`;
                } catch (err) {
                  alert("Encryption error: " + err.message);
                  statusEl.textContent = "Error: " + err.message;
                } finally {
                  btn.disabled = false;
                }
              }

              // =========================================================================
              // ATTACH ALL BUTTON LISTENERS ON LOAD
              // =========================================================================
              document.addEventListener('DOMContentLoaded', () => {
                refreshAdminLockUI();

                bindDropZone('viewerDropZone', 'vlockFileInput', onVlockFilePicked);
                bindDropZone('encryptDropZone', 'rawMediaInput', onRawMediaPicked);

                document.getElementById('btnFullScreen').addEventListener('click', () => {
                  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                });
                document.getElementById('btnFreeScreen').addEventListener('click', () => {
                  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
                });

                const dotsMenu = document.getElementById('dotsMenu');
                document.getElementById('btnDots').addEventListener('click', (e) => {
                  e.stopPropagation();
                  dotsMenu.classList.toggle('show');
                });
                document.addEventListener('click', () => dotsMenu.classList.remove('show'));

                document.getElementById('menuSuperuser').addEventListener('click', () => {
                  document.getElementById('suLoginBox').style.display = 'flex';
                  document.getElementById('suGeneratorBox').style.display = 'none';
                  document.getElementById('suPasswordInput').value = '';
                  document.getElementById('superuserModal').classList.add('show');
                });

                document.getElementById('menuSupport').addEventListener('click', () => {
                  document.getElementById('infoModalTitle').textContent = "Support & Contact";
                  document.getElementById('infoModalBody').textContent = "For any issue contact @Modrat_editor using Telegram.";
                  document.getElementById('infoModal').classList.add('show');
                });

                document.getElementById('menuCopyright').addEventListener('click', () => {
                  document.getElementById('infoModalTitle').textContent = "Copyright & Legal Notice";
                  document.getElementById('infoModalBody').textContent =
                    "VLock Media Security Suite v2.3\n© 2026 VLock Studio. All Rights Reserved.\n\n" +
                    "This software and its cryptographic stream architecture are protected by copyright law and international treaties. " +
                    "Unauthorized reproduction, reverse engineering, or tampering may result in severe civil and criminal penalties.\n\n" +
                    "For any issue contact @Modrat_editor using Telegram.";
                  document.getElementById('infoModal').classList.add('show');
                });

                document.getElementById('btnCloseSuModal1').addEventListener('click', () => {
                  document.getElementById('superuserModal').classList.remove('show');
                });
                document.getElementById('btnCloseSuModal2').addEventListener('click', () => {
                  document.getElementById('superuserModal').classList.remove('show');
                });
                document.getElementById('btnCloseInfoModal').addEventListener('click', () => {
                  document.getElementById('infoModal').classList.remove('show');
                });
                document.getElementById('btnCopyTelegram').addEventListener('click', () => {
                  copyTextSafe("@Modrat_editor", "Copied @Modrat_editor to clipboard!");
                });

                document.getElementById('btnPasteViewerKey').addEventListener('click', () => pasteIntoField('viewerKeyInput'));
                document.getElementById('btnPasteSessionKey').addEventListener('click', () => pasteIntoField('sessionKeyInput'));
                document.getElementById('btnPasteSuPwd').addEventListener('click', () => pasteIntoField('suPasswordInput'));

                document.getElementById('btnLoginSu').addEventListener('click', handleSuperuserLogin);
                document.getElementById('suPasswordInput').addEventListener('keydown', (e) => {
                  if (e.key === 'Enter') handleSuperuserLogin();
                });
                document.getElementById('btnGenerateSuKey').addEventListener('click', handleGenerateSessionKey);
                document.getElementById('btnCopySuKey').addEventListener('click', () => {
                  const val = document.getElementById('suGeneratedKeyOut').value;
                  if (val) copyTextSafe(val, "Session Key copied to clipboard!");
                });
                document.getElementById('btnLockDevice').addEventListener('click', () => {
                  localStorage.setItem('vlock_admin_expiry', '0');
                  refreshAdminLockUI();
                  document.getElementById('superuserModal').classList.remove('show');
                });

                document.getElementById('btnActivateSession').addEventListener('click', handleActivateSessionKey);
                document.getElementById('btnDecryptWatch').addEventListener('click', handleDecryptAndWatch);
                document.getElementById('btnCloseStream').addEventListener('click', closePlayerStream);
                document.getElementById('btnStartEncrypt').addEventListener('click', handleStartEncryption);

                document.getElementById('btnCopyBotKeys').addEventListener('click', () => {
                  if (lastGeneratedKeysContent) copyTextSafe(lastGeneratedKeysContent, "All generated keys copied to clipboard!");
                });
                document.getElementById('btnDownloadBotKeys').addEventListener('click', () => {
                  if (lastGeneratedKeysContent) {
                    saveBlobToDisk(new Blob([lastGeneratedKeysContent], { type: 'text/plain;charset=utf-8' }), 'bot_keys.txt');
                  }
                });

                document.getElementById('btnChangeSavePath').addEventListener('click', async () => {
                  if (window.showDirectoryPicker) {
                    try {
                      customDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                      document.getElementById('savePathLabel').textContent = "Current Save Path: Folder [" + customDirectoryHandle.name + "]";
                      return;
                    } catch (e) {}
                  }
                  const customName = prompt("Enter Subfolder / Label for Downloads:", "VLock");
                  if (customName) {
                    document.getElementById('savePathLabel').textContent = "Current Save Path: Downloads/" + customName;
                  }
                });

                document.getElementById('btnResetSavePath').addEventListener('click', () => {
                  customDirectoryHandle = null;
                  document.getElementById('savePathLabel').textContent = "Current Save Path: Default (Downloads / VLock)";
                });
              });
            </script>
          </body>
          </html>
          '''

          index_html = index_html.replace("__ZK_SALT_HEX__", salt.hex())
          index_html = index_html.replace("__ZK_VERIFIER_HEX__", verifier)
          index_html = index_html.replace("__ZK_ENC_D_HEX__", enc_d_hex)
          index_html = index_html.replace("__ZK_PUB_X_B64U__", pub_x_b64u)
          index_html = index_html.replace("__ZK_PUB_Y_B64U__", pub_y_b64u)

          with open("dist_web/index.html", "w", encoding="utf-8") as f:
              f.write(index_html)
          PYEOF

