              .adj-row label { font-size: 13px; font-weight: 700; color: #ffdcd7; display: flex; align-items: center; gap: 8px; cursor: pointer; }
              .num-input {
                width: 95px; background: #140507; border: 1px solid var(--red-border); border-radius: 7px;
                color: var(--red-bright); font-family: Consolas, monospace; font-size: 14px; font-weight: 700;
                padding: 7px 10px; text-align: center;
              }

              .player-wrap {
                display: none; flex-direction: column; gap: 8px; background: #000000; border-radius: 10px;
                padding: 10px; border: 1px solid var(--green-border); margin-top: 4px;
              }
              .player-wrap.active { display: flex; }
              video { width: 100%; max-height: 480px; border-radius: 6px; background: #000000; outline: none; }

              .progress-bar { width: 100%; height: 10px; background: #140507; border-radius: 5px; overflow: hidden; border: 1px solid #42141b; }
              .progress-fill { height: 100%; width: 0%; background: var(--red-bright); transition: width 0.1s; }

