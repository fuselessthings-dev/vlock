              const ZK_SALT_HEX = "__ZK_SALT_HEX__";
              const ZK_VERIFIER_HEX = "__ZK_VERIFIER_HEX__";
              const ZK_ENC_D_HEX = "__ZK_ENC_D_HEX__";
              const ZK_PUB_X_B64U = "__ZK_PUB_X_B64U__";
              const ZK_PUB_Y_B64U = "__ZK_PUB_Y_B64U__";
              const SLOT_SIZE = 48;

              const CODE_TO_SECONDS = { "1D": 86400, "1W": 7 * 86400, "1M": 30 * 86400, "1Y": 365 * 86400, "LT": -1 };
              const CODE_TO_LABEL = { "1D": "1 Day", "1W": "1 Week", "1M": "1 Month", "1Y": "1 Year", "LT": "Lifetime" };

              let selectedVlockFile = null;
              let selectedRawMediaFile = null;
              let customDirectoryHandle = null;
              let lastGeneratedKeysContent = "";
              let verifiedSuPassword = "";
              let activeStreamSessions = {};
              let currentObjectUrl = null;

              function hexToBytes(hex) {
                const out = new Uint8Array(hex.length / 2);
                for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
                return out;
              }
              function bytesToHex(bytes) {
                return Array.from(new Uint8Array(bytes)).map(b => b.toString(16).padStart(2, '0')).join('');
              }
              function bytesToBase64Url(bytes) {
                let bin = "";
                const arr = new Uint8Array(bytes);
                for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
              }
              function concatBytes(a, b) {
                const out = new Uint8Array(a.length + b.length);
                out.set(a, 0); out.set(b, a.length);
                return out;
              }
              async function sha256Bytes(data) {
                return new Uint8Array(await crypto.subtle.digest('SHA-256', data));
              }
              function makeCtrIv(nonce8, blockIndex) {
                const iv = new Uint8Array(16);
                iv.set(nonce8.slice(0, 8), 0);
                const dv = new DataView(iv.buffer);
                dv.setUint32(8, Math.floor(blockIndex / 4294967296), false);
                dv.setUint32(12, blockIndex >>> 0, false);
                return iv;
              }

              const B32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
              function base32Encode(bytes) {
                let out = "", buf = 0, bits = 0;
                for (let i = 0; i < bytes.length; i++) {
                  buf = (buf << 8) | bytes[i]; bits += 8;
                  while (bits >= 5) { out += B32_ALPHABET[(buf >>> (bits - 5)) & 31]; bits -= 5; }
                }
                if (bits > 0) out += B32_ALPHABET[(buf << (5 - bits)) & 31];
                return out;
              }
              function base32Decode(str) {
                const out = []; let buf = 0, bits = 0;
                for (let i = 0; i < str.length; i++) {
                  const v = B32_ALPHABET.indexOf(str[i]); if (v < 0) continue;
                  buf = (buf << 5) | v; bits += 5;
                  if (bits >= 8) { out.push((buf >>> (bits - 8)) & 255); bits -= 8; }
                }
                return new Uint8Array(out);
              }

              async function deriveZkKdf(passwordStr) {
                const enc = new TextEncoder();
                const baseKey = await crypto.subtle.importKey('raw', enc.encode(passwordStr), 'PBKDF2', false, ['deriveBits']);
                const bits = await crypto.subtle.deriveBits(
                  { name: 'PBKDF2', salt: hexToBytes(ZK_SALT_HEX), iterations: 200000, hash: 'SHA-256' },
                  baseKey, 256
                );
                return new Uint8Array(bits);
              }

              // PWA File Handling API: Auto-loads .vlock file when double-clicked on OS
              if ('launchQueue' in window) {
                window.launchQueue.setConsumer(async (launchParams) => {
                  if (!launchParams.files || launchParams.files.length === 0) return;
                  try {
                    const fileHandle = launchParams.files[0];
                    const file = await fileHandle.getFile();
                    onVlockFilePicked(file);
                    document.getElementById('viewerKeyInput').focus();
                  } catch (e) {}
                });
              }

              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
                navigator.serviceWorker.addEventListener('message', async (event) => {
                  const data = event.data;
                  if (!data || data.type !== 'VLOCK_STREAM_PULL') return;
                  const port = event.ports[0];
                  const sess = activeStreamSessions[data.sid];
                  if (!sess) { port.postMessage({ ok: false }); return; }
                  try {
                    const start = data.start, end = data.end;
                    const contentLen = (end - start) + 1;
                    const blockIndex = Math.floor(start / 16);
                    const byteSkip = start % 16;
                    const readStart = sess.payloadOffset + (blockIndex * 16);
                    const readEnd = Math.min(sess.file.size, readStart + contentLen + byteSkip + 16);
                    const encBuf = await sess.file.slice(readStart, readEnd).arrayBuffer();
                    const decFull = await crypto.subtle.decrypt(
                      { name: 'AES-CTR', counter: makeCtrIv(sess.nonce8, blockIndex), length: 64 },
                      sess.cryptoKey, encBuf
                    );
                    const sliced = decFull.slice(byteSkip, byteSkip + contentLen);
                    port.postMessage({ ok: true, buffer: sliced }, [sliced]);
                  } catch (err) {
                    port.postMessage({ ok: false });
                  }
                });
              }

              function onVlockFilePicked(file) {
                if (!file) return;
                selectedVlockFile = file;
                const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
                document.getElementById('viewerFileTitle').textContent = `Ready to Unlock: ${file.name} (${sizeMb} MB)`;
              }
              function onRawMediaPicked(file) {
                if (!file) return;
                selectedRawMediaFile = file;
                const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
                document.getElementById('encryptFileTitle').textContent = `Selected: ${file.name} (${sizeMb} MB)`;
              }

              function bindDropZone(zoneId, inputId, callback) {
                const zone = document.getElementById(zoneId);
                const input = document.getElementById(inputId);
                zone.addEventListener('click', () => input.click());
                input.addEventListener('change', () => {
                  if (input.files && input.files.length > 0) callback(input.files[0]);
                });
                zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
                zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
                zone.addEventListener('drop', (e) => {
                  e.preventDefault(); zone.classList.remove('dragover');
                  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) callback(e.dataTransfer.files[0]);
                });
              }

              async function pasteIntoField(inputId) {
                const el = document.getElementById(inputId);
                el.focus();
                try {
                  if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) { el.value = text.trim(); return; }
                  }
                } catch (e) {}
                const manual = prompt("Paste your key here:");
                if (manual !== null && manual.trim() !== "") el.value = manual.trim();
              }

              async function copyTextSafe(text, msg) {
                try {
                  await navigator.clipboard.writeText(text);
                  alert(msg || "Copied to clipboard!");
                } catch (e) {
                  prompt("Copy this text:", text);
                }
              }

              async function handleSuperuserLogin() {
                const pwd = document.getElementById('suPasswordInput').value;
                if (!pwd) { alert("Please enter the Superuser Password."); return; }
                const btn = document.getElementById('btnLoginSu');
                btn.disabled = true; btn.textContent = "Verifying...";
                try {
                  const kdf = await deriveZkKdf(pwd);
                  const check = await sha256Bytes(concatBytes(kdf, new TextEncoder().encode("VLOCK_SU_AUTH_v2")));
                  if (bytesToHex(check).toLowerCase() === ZK_VERIFIER_HEX.toLowerCase()) {
                    verifiedSuPassword = pwd;
                    document.getElementById('suLoginBox').style.display = 'none';
                    document.getElementById('suGeneratorBox').style.display = 'flex';
                  } else {
                    alert("Incorrect Superuser Password!");
                  }
                } catch (err) {
                  alert("Login error: " + err.message);
                } finally {
                  btn.disabled = false; btn.textContent = "Login";
                }
              }

              async function handleGenerateSessionKey() {
                try {
                  const code = document.getElementById('suDurationSelect').value;
                  const salt = hexToBytes(ZK_SALT_HEX);
                  const kdf = await deriveZkKdf(verifiedSuPassword);
                  const encD = hexToBytes(ZK_ENC_D_HEX);

                  const aesKey = await crypto.subtle.importKey('raw', kdf, 'AES-CTR', false, ['decrypt']);
                  const iv = new Uint8Array(16); iv.set(salt.slice(0, 8), 0);
                  const dRaw = await crypto.subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 64 }, aesKey, encD);

                  const jwkPriv = {
                    kty: "EC", crv: "P-256",
                    x: ZK_PUB_X_B64U, y: ZK_PUB_Y_B64U,
                    d: bytesToBase64Url(dRaw), ext: true
                  };
                  const ecPrivKey = await crypto.subtle.importKey('jwk', jwkPriv, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']);

                  const rnd = crypto.getRandomValues(new Uint8Array(4));
                  const nonce = bytesToHex(rnd).toUpperCase();
                  const msg = `VLKS-${code}-${nonce}`;
                  const rawSig = new Uint8Array(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, ecPrivKey, new TextEncoder().encode(msg)));

                  const fullKey = `${msg}-${base32Encode(rawSig)}`;
                  document.getElementById('suGeneratedKeyOut').value = fullKey;
                  copyTextSafe(fullKey, "Session Key generated and copied to clipboard!");
                } catch (err) {
                  alert("Error generating Session Key: " + err.message);
                }
              }

              async function handleActivateSessionKey() {
                try {
                  const raw = document.getElementById('sessionKeyInput').value.trim().toUpperCase();
                  if (!raw) { alert("Please paste a Session Key first."); return; }
                  const parts = raw.split('-');
                  if (parts.length !== 4 || parts[0] !== 'VLKS') throw new Error("Invalid Session Key format.");
                  const [_, code, nonce, sigB32] = parts;
                  if (!(code in CODE_TO_SECONDS)) throw new Error("Unknown duration code.");

                  const rawSig = base32Decode(sigB32);
                  const jwkPub = { kty: "EC", crv: "P-256", x: ZK_PUB_X_B64U, y: ZK_PUB_Y_B64U, ext: true };
                  const pubKey = await crypto.subtle.importKey('jwk', jwkPub, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);

                  const valid = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, pubKey, rawSig, new TextEncoder().encode(`VLKS-${code}-${nonce}`));
                  if (!valid) throw new Error("Invalid or forged Session Key signature.");

                  const usedNonces = JSON.parse(localStorage.getItem('vlock_used_nonces') || '[]');
                  if (usedNonces.includes(nonce)) throw new Error("This Session Key has already been used on this device.");
                  usedNonces.push(nonce);
                  localStorage.setItem('vlock_used_nonces', JSON.stringify(usedNonces));

                  const secs = CODE_TO_SECONDS[code];
                  const expiry = secs === -1 ? -1 : Math.floor(Date.now() / 1000) + secs;
                  localStorage.setItem('vlock_admin_expiry', String(expiry));
                  localStorage.setItem('vlock_admin_plan', CODE_TO_LABEL[code]);

                  document.getElementById('sessionKeyInput').value = '';
                  refreshAdminLockUI();
                  alert("Admin Encryption Panel unlocked for: " + CODE_TO_LABEL[code]);
                } catch (err) {
                  alert(err.message);
                }
              }

              function refreshAdminLockUI() {
                const expiry = parseInt(localStorage.getItem('vlock_admin_expiry') || '0', 10);
                const plan = localStorage.getItem('vlock_admin_plan') || '';
                const now = Math.floor(Date.now() / 1000);
                const badge = document.getElementById('adminStatusBadge');
                const lockedSec = document.getElementById('adminLockedSection');
                const unlockedSec = document.getElementById('adminUnlockedSection');

                if (expiry === -1) {
                  badge.textContent = "Unlocked • Lifetime Access"; badge.style.color = "#3fb950";
                  lockedSec.style.display = 'none'; unlockedSec.style.display = 'flex';
                } else if (expiry > now) {
                  const rem = expiry - now;
                  badge.textContent = `Unlocked • ${plan} (${Math.floor(rem / 86400)}d ${Math.floor((rem % 86400) / 3600)}h left)`;
                  badge.style.color = "#3fb950";
                  lockedSec.style.display = 'none'; unlockedSec.style.display = 'flex';
                } else {
                  badge.textContent = "Locked • Session Key Required"; badge.style.color = "#ffa198";
                  lockedSec.style.display = 'flex'; unlockedSec.style.display = 'none';
                }
              }

              function resolveMimeType(ext) {
                const e = ext.toLowerCase();
                const map = {
                  '.mp4': 'video/mp4', '.m4v': 'video/mp4', '.mkv': 'video/x-matroska', '.webm': 'video/webm',
                  '.avi': 'video/x-msvideo', '.mov': 'video/quicktime', '.ts': 'video/mp2t', '.mp3': 'audio/mpeg',
                  '.flac': 'audio/flac', '.wav': 'audio/wav', '.aac': 'audio/aac', '.ogg': 'audio/ogg', '.m4a': 'audio/mp4'
                };
                return map[e] || 'video/mp4';
              }

              async function handleDecryptAndWatch() {
                if (!selectedVlockFile) { alert("Please tap or drag & drop a .vlock media file first."); return; }
                const rawKey = document.getElementById('viewerKeyInput').value.trim().toUpperCase();
                if (!rawKey) { alert("Please paste your One-Time Key or Permanent Masterkey."); return; }

                const btn = document.getElementById('btnDecryptWatch');
                btn.disabled = true; btn.textContent = "Verifying Key & Preparing Stream...";

                try {
                  const enc = new TextEncoder();
                  const kBytes = enc.encode(rawKey);
                  const targetKeyId = (await sha256Bytes(kBytes)).slice(0, 15);
                  const wrapMask = await sha256Bytes(concatBytes(kBytes, enc.encode("VLOCK_WRAP")));

                  const headBuf = await selectedVlockFile.slice(0, 66).arrayBuffer();
                  const headBytes = new Uint8Array(headBuf);
                  if (new TextDecoder().decode(headBytes.slice(0, 4)) !== "VLCK") throw new Error("Not a valid .vlock encrypted file.");

                  const dv = new DataView(headBuf);
                  const version = dv.getUint16(4, false);
                  let ext = ".mp4", nonce8, verifyHash, numKeys, fixedLen;

                  if (version === 1) {
                    ext = new TextDecoder().decode(headBytes.slice(6, 14)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headBytes.slice(14, 22); verifyHash = headBytes.slice(22, 54);
                    numKeys = dv.getUint32(54, false); fixedLen = 58;
                  } else if (version === 2) {
                    ext = new TextDecoder().decode(headBytes.slice(6, 22)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headBytes.slice(22, 30); verifyHash = headBytes.slice(30, 62);
                    numKeys = dv.getUint32(62, false); fixedLen = 66;
                  } else throw new Error("Unsupported .vlock version: " + version);

                  const payloadOffset = fixedLen + (numKeys * SLOT_SIZE);
                  const payloadSize = selectedVlockFile.size - payloadOffset;
                  const slotsData = new Uint8Array(await selectedVlockFile.slice(fixedLen, payloadOffset).arrayBuffer());

                  let matchedIdx = -1, slotStatus = 0, wrappedMk = null;
                  for (let i = 0; i < numKeys; i++) {
                    const off = i * SLOT_SIZE;
                    let same = true;
                    for (let b = 0; b < 15; b++) if (slotsData[off + 1 + b] !== targetKeyId[b]) { same = false; break; }
                    if (same) { matchedIdx = i; slotStatus = slotsData[off]; wrappedMk = slotsData.slice(off + 16, off + 48); break; }
                  }
                  if (matchedIdx === -1) throw new Error("Invalid Decryption Key! Please check the key from the Telegram Bot.");

                  const keyHex = bytesToHex(targetKeyId);
                  const burnedKeys = JSON.parse(localStorage.getItem('vlock_burned_keys') || '{}');
                  if (slotStatus === 0 || (slotStatus === 1 && burnedKeys[keyHex])) {
                    throw new Error("Previous key expired! Please enter a new key from the Telegram Bot to watch again.");
                  }

                  const masterKey = new Uint8Array(32);
                  for (let i = 0; i < 32; i++) masterKey[i] = wrappedMk[i] ^ wrapMask[i];
                  const checkHash = await sha256Bytes(concatBytes(masterKey, enc.encode("VLOCK_VERIFY")));
                  if (bytesToHex(checkHash) !== bytesToHex(verifyHash)) throw new Error("Key verification failed.");

                  const cryptoKey = await crypto.subtle.importKey('raw', masterKey, 'AES-CTR', false, ['decrypt']);
                  if (slotStatus === 2) {
                    await restoreOriginalMediaLocally(selectedVlockFile, cryptoKey, nonce8, payloadOffset, payloadSize, ext);
                    return;
                  }

                  burnedKeys[keyHex] = Date.now();
                  localStorage.setItem('vlock_burned_keys', JSON.stringify(burnedKeys));

                  closePlayerStream();
                  const mime = resolveMimeType(ext);
                  document.getElementById('playerWrap').classList.add('active');
                  document.getElementById('nowPlayingLabel').textContent = "Now Playing: " + selectedVlockFile.name;
                  const videoEl = document.getElementById('vlockVideoPlayer');

                  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
                    activeStreamSessions[sid] = { file: selectedVlockFile, cryptoKey, nonce8, payloadOffset, payloadSize };
                    videoEl.src = `./__vlock_stream__/Episode${ext}?sid=${sid}&size=${payloadSize}&mime=${encodeURIComponent(mime)}`;
                    videoEl.play().catch(() => {});
                  } else {
                    const blobParts = [];
                    const chunkSize = 8 * 1024 * 1024;
                    let offset = 0;
                    while (offset < payloadSize) {
                      const len = Math.min(chunkSize, payloadSize - offset);
                      const encChunk = await selectedVlockFile.slice(payloadOffset + offset, payloadOffset + offset + len).arrayBuffer();
                      const decChunk = await crypto.subtle.decrypt(
                        { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                        cryptoKey, encChunk
                      );
                      blobParts.push(new Blob([decChunk]));
                      offset += len;
                    }
                    currentObjectUrl = URL.createObjectURL(new Blob(blobParts, { type: mime }));
                    videoEl.src = currentObjectUrl;
                    videoEl.play().catch(() => {});
                  }
                } catch (err) {
                  alert(err.message);
                } finally {
                  btn.disabled = false; btn.textContent = "▶ Decrypt & Watch / Unlock";
                }
              }

              function closePlayerStream() {
                const videoEl = document.getElementById('vlockVideoPlayer');
                videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load();
                if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
                activeStreamSessions = {};
                document.getElementById('playerWrap').classList.remove('active');
              }

              async function restoreOriginalMediaLocally(vlockFile, cryptoKey, nonce8, payloadOffset, payloadSize, ext) {
                const blobParts = [];
                const chunkSize = 8 * 1024 * 1024;
                let offset = 0;
                while (offset < payloadSize) {
                  const len = Math.min(chunkSize, payloadSize - offset);
                  const encChunk = await vlockFile.slice(payloadOffset + offset, payloadOffset + offset + len).arrayBuffer();
                  const decChunk = await crypto.subtle.decrypt(
                    { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                    cryptoKey, encChunk
                  );
                  blobParts.push(new Blob([decChunk]));
                  offset += len;
                }
                const outName = `${vlockFile.name.replace(/\.vlock$/i, '')}_Unlocked${ext}`;
                await saveBlobToDisk(new Blob(blobParts, { type: resolveMimeType(ext) }), outName);
                alert("Permanent Masterkey Verified!\n\nVideo unlocked forever and restored to its original format: " + outName);
              }

              async function saveBlobToDisk(blob, filename) {
                if (customDirectoryHandle) {
                  try {
                    const fh = await customDirectoryHandle.getFileHandle(filename, { create: true });
                    const wr = await fh.createWritable();
                    await wr.write(blob); await wr.close();
                    return;
                  } catch (e) {}
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
              }

              function generateHumanKey(prefix) {
                const alpha = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
                const rnd = crypto.getRandomValues(new Uint8Array(12));
                let g1 = "", g2 = "", g3 = "";
                for (let i = 0; i < 4; i++) {
                  g1 += alpha[rnd[i] % alpha.length];
                  g2 += alpha[rnd[i + 4] % alpha.length];
                  g3 += alpha[rnd[i + 8] % alpha.length];
                }
                return `${prefix}-${g1}-${g2}-${g3}`;
              }

              async function handleStartEncryption() {
                refreshAdminLockUI();
                if (document.getElementById('adminUnlockedSection').style.display === 'none') { alert("Admin Encryption Panel is locked."); return; }
                if (!selectedRawMediaFile) { alert("Please select or drag & drop a video or audio file first."); return; }

                const numTempKeys = parseInt(document.getElementById('numTempKeysInput').value || '0', 10);
                const includePerm = document.getElementById('permMasterCheckbox').checked;

                if (isNaN(numTempKeys) || numTempKeys < 0 || numTempKeys > 100000) { alert("Enter a valid number of Temporary Keys (0 to 100000)."); return; }
                if (numTempKeys === 0 && !includePerm) {
                  alert("Temporary Keys is 0 and Permanent Masterkey is unchecked.\n\nPlease set Temporary Keys > 0 or check 'Permanent Masterkey' (or both).");
                  return;
                }

                const btn = document.getElementById('btnStartEncrypt');
                const statusEl = document.getElementById('encryptStatusText');
                const progEl = document.getElementById('encryptProgressFill');
                btn.disabled = true; progEl.style.width = '0%';
                statusEl.textContent = "Step 1/2: Generating keys instantly...";

                try {
                  const enc = new TextEncoder();
                  const dotIdx = selectedRawMediaFile.name.lastIndexOf('.');
                  const ext = (dotIdx >= 0 ? selectedRawMediaFile.name.slice(dotIdx).toLowerCase() : '.mp4').slice(0, 16);
                  const stem = dotIdx > 0 ? selectedRawMediaFile.name.slice(0, dotIdx) : selectedRawMediaFile.name;

                  const extBytes16 = new Uint8Array(16);
                  extBytes16.set(enc.encode(ext).slice(0, 16), 0);

                  const masterKey = crypto.getRandomValues(new Uint8Array(32));
                  const nonce8 = crypto.getRandomValues(new Uint8Array(8));
                  const verifyHash = await sha256Bytes(concatBytes(masterKey, enc.encode("VLOCK_VERIFY")));

                  const totalSlots = numTempKeys + (includePerm ? 1 : 0);
                  const slotsBuffer = new Uint8Array(totalSlots * SLOT_SIZE);
                  const keyLines = [];
                  let slotIdx = 0;

                  if (includePerm) {
                    const pkStr = generateHumanKey("VLOCK-MASTER");
                    keyLines.push("=== PERMANENT MASTERKEY (UNLOCKS FOREVER & RESTORES ORIGINAL VIDEO) ===", pkStr, "");
                    const pkBytes = enc.encode(pkStr);
                    const pkId = (await sha256Bytes(pkBytes)).slice(0, 15);
                    const pkMask = await sha256Bytes(concatBytes(pkBytes, enc.encode("VLOCK_WRAP")));
                    const off = slotIdx * SLOT_SIZE;
                    slotsBuffer[off] = 2; slotsBuffer.set(pkId, off + 1);
                    for (let b = 0; b < 32; b++) slotsBuffer[off + 16 + b] = masterKey[b] ^ pkMask[b];
                    slotIdx++;
                  }

                  if (numTempKeys > 0) {
                    if (includePerm) keyLines.push(`=== ONE-TIME TEMPORARY KEYS (${numTempKeys}) ===`);
                    for (let i = 0; i < numTempKeys; i++) {
                      const kStr = generateHumanKey("VLOCK");
                      keyLines.push(kStr);
                      const kBytes = enc.encode(kStr);
                      const kId = (await sha256Bytes(kBytes)).slice(0, 15);
                      const kMask = await sha256Bytes(concatBytes(kBytes, enc.encode("VLOCK_WRAP")));
                      const off = slotIdx * SLOT_SIZE;
                      slotsBuffer[off] = 1; slotsBuffer.set(kId, off + 1);
                      for (let b = 0; b < 32; b++) slotsBuffer[off + 16 + b] = masterKey[b] ^ kMask[b];
                      slotIdx++;
                    }
                  }

                  lastGeneratedKeysContent = keyLines.join('\n') + '\n';
                  document.getElementById('keysTextarea').value = lastGeneratedKeysContent;
                  document.getElementById('keysOutputBox').classList.add('show');
                  await saveBlobToDisk(new Blob([lastGeneratedKeysContent], { type: 'text/plain;charset=utf-8' }), 'bot_keys.txt');

                  const headerFixed = new Uint8Array(66);
                  headerFixed.set(enc.encode("VLCK"), 0);
                  const hDv = new DataView(headerFixed.buffer);
                  hDv.setUint16(4, 2, false);
                  headerFixed.set(extBytes16, 6);
                  headerFixed.set(nonce8, 22);
                  headerFixed.set(verifyHash, 30);
                  hDv.setUint32(62, totalSlots, false);

                  const cryptoKey = await crypto.subtle.importKey('raw', masterKey, 'AES-CTR', false, ['encrypt']);
                  const blobParts = [new Blob([headerFixed]), new Blob([slotsBuffer])];

                  const chunkSize = 8 * 1024 * 1024;
                  const totalSize = selectedRawMediaFile.size;
                  let offset = 0;

                  while (offset < totalSize) {
                    const len = Math.min(chunkSize, totalSize - offset);
                    const plainSlice = await selectedRawMediaFile.slice(offset, offset + len).arrayBuffer();
                    const encSlice = await crypto.subtle.encrypt(
                      { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                      cryptoKey, plainSlice
                    );
                    blobParts.push(new Blob([encSlice]));
                    offset += len;
                    const pct = Math.min(100, Math.round((offset / totalSize) * 100));
                    progEl.style.width = pct + '%';
                    statusEl.textContent = `Step 2/2: Encrypting locally on device... ${pct}% (0 MB internet used)`;
                  }

                  await saveBlobToDisk(new Blob(blobParts, { type: 'application/octet-stream' }), `${stem}.vlock`);
                  statusEl.textContent = `Done! Saved ${stem}.vlock & bot_keys.txt to your device.`;
                } catch (err) {
                  alert("Encryption error: " + err.message);
                  statusEl.textContent = "Error: " + err.message;
                } finally {
                  btn.disabled = false;
                }
              }

              document.addEventListener('DOMContentLoaded', () => {
                refreshAdminLockUI();

                // Check if redirected from a clicked .vlock file (?file=Episode.vlock)
                const params = new URLSearchParams(window.location.search);
                const redirectedFile = params.get('file');
                if (redirectedFile) {
                  document.getElementById('viewerFileTitle').textContent = `Redirected from: ${redirectedFile} — Tap Here to Confirm File`;
                  document.getElementById('userPanelCard').scrollIntoView({ behavior: 'smooth' });
                }

                bindDropZone('viewerDropZone', 'vlockFileInput', onVlockFilePicked);
                bindDropZone('encryptDropZone', 'rawMediaInput', onRawMediaPicked);

                document.getElementById('btnScrollTutorial').addEventListener('click', () => {
                  document.getElementById('tutorialSection').scrollIntoView({ behavior: 'smooth' });
                });

                document.getElementById('btnFullScreen').addEventListener('click', () => {
                  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                });
                document.getElementById('btnFreeScreen').addEventListener('click', () => {
                  if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
                });

                const dotsMenu = document.getElementById('dotsMenu');
                document.getElementById('btnDots').addEventListener('click', (e) => {
                  e.stopPropagation();
                  dotsMenu.classList.toggle('show');
                });
                document.addEventListener('click', () => dotsMenu.classList.remove('show'));

                document.getElementById('menuSuperuser').addEventListener('click', () => {
                  document.getElementById('suLoginBox').style.display = 'flex';
                  document.getElementById('suGeneratorBox').style.display = 'none';
                  document.getElementById('suPasswordInput').value = '';
                  document.getElementById('superuserModal').classList.add('show');
                });

                document.getElementById('menuSupport').addEventListener('click', () => {
                  document.getElementById('infoModalTitle').textContent = "Support & Contact";
                  document.getElementById('infoModalBody').textContent = "For any issue contact @Modrat_editor using Telegram.";
                  document.getElementById('infoModal').classList.add('show');
                });

                document.getElementById('menuCopyright').addEventListener('click', () => {
                  document.getElementById('infoModalTitle').textContent = "Copyright & Legal Notice";
                  document.getElementById('infoModalBody').textContent =
                    "VLock Media Security Suite v2.5\n© 2026 VLock Studio. All Rights Reserved.\n\n" +
                    "This software and its cryptographic stream architecture are protected by copyright law and international treaties. " +
                    "Unauthorized reproduction, reverse engineering, or tampering may result in severe civil and criminal penalties.\n\n" +
                    "For any issue contact @Modrat_editor using Telegram.";
                  document.getElementById('infoModal').classList.add('show');
                });

                document.getElementById('btnCloseSuModal1').addEventListener('click', () => {
                  document.getElementById('superuserModal').classList.remove('show');
                });
                document.getElementById('btnCloseSuModal2').addEventListener('click', () => {
                  document.getElementById('superuserModal').classList.remove('show');
                });
                document.getElementById('btnCloseInfoModal').addEventListener('click', () => {
                  document.getElementById('infoModal').classList.remove('show');
                });
                document.getElementById('btnCopyTelegram').addEventListener('click', () => {
                  copyTextSafe("@Modrat_editor", "Copied @Modrat_editor to clipboard!");
                });

                document.getElementById('btnPasteViewerKey').addEventListener('click', () => pasteIntoField('viewerKeyInput'));
                document.getElementById('btnPasteSessionKey').addEventListener('click', () => pasteIntoField('sessionKeyInput'));
                document.getElementById('btnPasteSuPwd').addEventListener('click', () => pasteIntoField('suPasswordInput'));

                document.getElementById('btnLoginSu').addEventListener('click', handleSuperuserLogin);
                document.getElementById('suPasswordInput').addEventListener('keydown', (e) => {
                  if (e.key === 'Enter') handleSuperuserLogin();
                });
                document.getElementById('btnGenerateSuKey').addEventListener('click', handleGenerateSessionKey);
                document.getElementById('btnCopySuKey').addEventListener('click', () => {
                  const val = document.getElementById('suGeneratedKeyOut').value;
                  if (val) copyTextSafe(val, "Session Key copied to clipboard!");
                });
                document.getElementById('btnLockDevice').addEventListener('click', () => {
                  localStorage.setItem('vlock_admin_expiry', '0');
                  refreshAdminLockUI();
                  document.getElementById('superuserModal').classList.remove('show');
                });

                document.getElementById('btnActivateSession').addEventListener('click', handleActivateSessionKey);
                document.getElementById('btnDecryptWatch').addEventListener('click', handleDecryptAndWatch);
                document.getElementById('btnCloseStream').addEventListener('click', closePlayerStream);
                document.getElementById('btnStartEncrypt').addEventListener('click', handleStartEncryption);

                document.getElementById('btnCopyBotKeys').addEventListener('click', () => {
                  if (lastGeneratedKeysContent) copyTextSafe(lastGeneratedKeysContent, "All generated keys copied to clipboard!");
                });
                document.getElementById('btnDownloadBotKeys').addEventListener('click', () => {
                  if (lastGeneratedKeysContent) {
                    saveBlobToDisk(new Blob([lastGeneratedKeysContent], { type: 'text/plain;charset=utf-8' }), 'bot_keys.txt');
                  }
                });

                document.getElementById('btnChangeSavePath').addEventListener('click', async () => {
                  if (window.showDirectoryPicker) {
                    try {
                      customDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                      document.getElementById('savePathLabel').textContent = "Current Save Path: Folder [" + customDirectoryHandle.name + "]";
                      return;
                    } catch (e) {}
                  }
                  const customName = prompt("Enter Subfolder / Label for Downloads:", "VLock");
                  if (customName) {
                    document.getElementById('savePathLabel').textContent = "Current Save Path: Downloads/" + customName;
                  }
                });

                document.getElementById('btnResetSavePath').addEventListener('click', () => {
                  customDirectoryHandle = null;
                  document.getElementById('savePathLabel').textContent = "Current Save Path: Default (Downloads / VLock)";
                });
              });
            </script>
          </body>
          </html>
          '''

          index_html = index_html.replace("__ZK_SALT_HEX__", salt.hex())
          index_html = index_html.replace("__ZK_VERIFIER_HEX__", verifier)
          index_html = index_html.replace("__ZK_ENC_D_HEX__", enc_d_hex)
          index_html = index_html.replace("__ZK_PUB_X_B64U__", pub_x_b64u)
          index_html = index_html.replace("__ZK_PUB_Y_B64U__", pub_y_b64u)

          with open("dist_web/index.html", "w", encoding="utf-8") as f:
              f.write(index_html)
          PYEOF

