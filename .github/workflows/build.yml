                padding: 10px 12px; text-align: center; outline: none;
              }
              .input-box.red-input { background: #140507; border-color: var(--red-border); color: var(--red-bright); }

              .adj-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 4px 0; }
              .adj-row label { font-size: 13px; font-weight: 700; color: #ffdcd7; display: flex; align-items: center; gap: 8px; cursor: pointer; }
              .num-input {
                width: 95px; background: #140507; border: 1px solid var(--red-border); border-radius: 7px;
