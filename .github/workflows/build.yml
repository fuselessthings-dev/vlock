                btn.disabled = true;
                btn.textContent = "Verifying Key & Preparing Stream...";

                try {
                  const enc = new TextEncoder();
                  const kBytes = enc.encode(rawKey);
                  const targetKeyId = (await sha256Bytes(kBytes)).slice(0, 15);
                  const wrapMask = await sha256Bytes(concatBytes(kBytes, enc.encode("VLOCK_WRAP")));

                  const headBuf = await selectedVlockFile.slice(0, 66).arrayBuffer();
                  const headBytes = new Uint8Array(headBuf);
                  if (new TextDecoder().decode(headBytes.slice(0, 4)) !== "VLCK") {
                    throw new Error("Not a valid .vlock encrypted file.");
                  }

                  const dv = new DataView(headBuf);
                  const version = dv.getUint16(4, false);
                  let ext = ".mp4", nonce8, verifyHash, numKeys, fixedLen;

                  if (version === 1) {
                    ext = new TextDecoder().decode(headBytes.slice(6, 14)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headBytes.slice(14, 22);
                    verifyHash = headBytes.slice(22, 54);
                    numKeys = dv.getUint32(54, false);
                    fixedLen = 58;
                  } else if (version === 2) {
                    ext = new TextDecoder().decode(headBytes.slice(6, 22)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headBytes.slice(22, 30);
                    verifyHash = headBytes.slice(30, 62);
                    numKeys = dv.getUint32(62, false);
                    fixedLen = 66;
                  } else {
                    throw new Error("Unsupported .vlock format version: " + version);
                  }

                  const payloadOffset = fixedLen + (numKeys * SLOT_SIZE);
                  const payloadSize = selectedVlockFile.size - payloadOffset;
                  const slotsData = new Uint8Array(await selectedVlockFile.slice(fixedLen, payloadOffset).arrayBuffer());

                  let matchedIdx = -1, slotStatus = 0, wrappedMk = null;
                  for (let i = 0; i < numKeys; i++) {
                    const off = i * SLOT_SIZE;
                    let same = true;
                    for (let b = 0; b < 15; b++) {
                      if (slotsData[off + 1 + b] !== targetKeyId[b]) { same = false; break; }
                    }
                    if (same) {
                      matchedIdx = i;
                      slotStatus = slotsData[off];
                      wrappedMk = slotsData.slice(off + 16, off + 48);
                      break;
                    }
                  }

                  if (matchedIdx === -1) {
                    throw new Error("Invalid Decryption Key! Please check the key from the Telegram Bot.");
                  }

                  const keyHex = bytesToHex(targetKeyId);
                  const burnedKeys = JSON.parse(localStorage.getItem('vlock_burned_keys') || '{}');
                  if (slotStatus === 0 || (slotStatus === 1 && burnedKeys[keyHex])) {
                    throw new Error("Previous key expired! Please enter a new key from the Telegram Bot to watch again.");
                  }

                  const masterKey = new Uint8Array(32);
                  for (let i = 0; i < 32; i++) masterKey[i] = wrappedMk[i] ^ wrapMask[i];

                  const checkHash = await sha256Bytes(concatBytes(masterKey, enc.encode("VLOCK_VERIFY")));
                  if (bytesToHex(checkHash) !== bytesToHex(verifyHash)) {
                    throw new Error("Key verification failed.");
                  }

                  const cryptoKey = await crypto.subtle.importKey('raw', masterKey, 'AES-CTR', false, ['decrypt']);

                  // IF PERMANENT MASTERKEY (slotStatus === 2): RESTORE ORIGINAL VIDEO FOREVER
                  if (slotStatus === 2) {
                    await restoreOriginalMediaLocally(selectedVlockFile, cryptoKey, nonce8, payloadOffset, payloadSize, ext);
                    return;
                  }

                  // BURN ONE-TIME KEY IMMEDIATELY
                  burnedKeys[keyHex] = Date.now();
                  localStorage.setItem('vlock_burned_keys', JSON.stringify(burnedKeys));

                  closePlayerStream();
                  const mime = resolveMimeType(ext);
                  document.getElementById('playerWrap').classList.add('active');
                  document.getElementById('nowPlayingLabel').textContent = "Now Playing: " + selectedVlockFile.name;
                  const videoEl = document.getElementById('vlockVideoPlayer');

                  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
                    activeStreamSessions[sid] = { file: selectedVlockFile, cryptoKey, nonce8, payloadOffset, payloadSize };
                    videoEl.src = `./__vlock_stream__/Episode${ext}?sid=${sid}&size=${payloadSize}&mime=${encodeURIComponent(mime)}`;
                    videoEl.play().catch(() => {});
                  } else {
                    // Disk-backed Blob chunking so even 1GB+ files don't overflow JS heap
                    const blobParts = [];
                    const chunkSize = 8 * 1024 * 1024;
                    let offset = 0;
                    while (offset < payloadSize) {
                      const len = Math.min(chunkSize, payloadSize - offset);
                      const encChunk = await selectedVlockFile.slice(payloadOffset + offset, payloadOffset + offset + len).arrayBuffer();
                      const decChunk = await crypto.subtle.decrypt(
                        { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                        cryptoKey,
                        encChunk
                      );
                      blobParts.push(new Blob([decChunk]));
                      offset += len;
                    }
                    currentObjectUrl = URL.createObjectURL(new Blob(blobParts, { type: mime }));
                    videoEl.src = currentObjectUrl;
                    videoEl.play().catch(() => {});
                  }
                } catch (err) {
                  alert(err.message);
                } finally {
                  btn.disabled = false;
                  btn.textContent = "▶ Decrypt & Watch / Unlock";
                }
              }

              function closePlayerStream() {
                const videoEl = document.getElementById('vlockVideoPlayer');
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load();
                if (currentObjectUrl) {
                  URL.revokeObjectURL(currentObjectUrl);
                  currentObjectUrl = null;
                }
                activeStreamSessions = {};
                document.getElementById('playerWrap').classList.remove('active');
              }

              async function restoreOriginalMediaLocally(vlockFile, cryptoKey, nonce8, payloadOffset, payloadSize, ext) {
                const blobParts = [];
                const chunkSize = 8 * 1024 * 1024;
                let offset = 0;
                while (offset < payloadSize) {
                  const len = Math.min(chunkSize, payloadSize - offset);
                  const encChunk = await vlockFile.slice(payloadOffset + offset, payloadOffset + offset + len).arrayBuffer();
                  const decChunk = await crypto.subtle.decrypt(
                    { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                    cryptoKey,
                    encChunk
                  );
                  blobParts.push(new Blob([decChunk]));
                  offset += len;
                }
                const outName = `${vlockFile.name.replace(/\.vlock$/i, '')}_Unlocked${ext}`;
                await saveBlobToDisk(new Blob(blobParts, { type: resolveMimeType(ext) }), outName);
                alert("Permanent Masterkey Verified!\n\nVideo unlocked forever and restored to its original format: " + outName);
              }

              async function saveBlobToDisk(blob, filename) {
                if (customDirectoryHandle) {
                  try {
                    const fh = await customDirectoryHandle.getFileHandle(filename, { create: true });
                    const wr = await fh.createWritable();
                    await wr.write(blob);
                    await wr.close();
                    return;
                  } catch (e) {}
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
              }

              // =========================================================================
              // ADMIN PANEL: INSTANT KEY GENERATION + LOCAL 1GB+ ENCRYPTION
              // =========================================================================
              function generateHumanKey(prefix) {
                const alpha = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
                const rnd = crypto.getRandomValues(new Uint8Array(12));
                let g1 = "", g2 = "", g3 = "";
                for (let i = 0; i < 4; i++) {
                  g1 += alpha[rnd[i] % alpha.length];
                  g2 += alpha[rnd[i + 4] % alpha.length];
                  g3 += alpha[rnd[i + 8] % alpha.length];
                }
                return `${prefix}-${g1}-${g2}-${g3}`;
              }

              async function handleStartEncryption() {
                refreshAdminLockUI();
                if (document.getElementById('adminUnlockedSection').style.display === 'none') {
                  alert("Admin Encryption Panel is locked.");
                  return;
                }
