              // =========================================================================
              // REAL FRAME DECODE PROBE & SAME-ORIGIN FFMPEG WASM ENGINE
              // =========================================================================
              function isAudioOnlyExt(ext) {
                const e = (ext || '').toLowerCase();
                return ['.mp3', '.wav', '.ogg', '.flac', '.aac', '.m4a'].includes(e);
              }

              function getCandidateMimes(ext, firstBytes) {
                const e = (ext || '').toLowerCase();
                if (isAudioOnlyExt(e)) {
                  const audioMap = {
                    '.mp3': 'audio/mpeg', '.wav': 'audio/wav', '.ogg': 'audio/ogg',
                    '.flac': 'audio/flac', '.aac': 'audio/aac', '.m4a': 'audio/mp4'
                  };
                  return [audioMap[e] || 'audio/mp4', ''];
                }
                if (firstBytes && firstBytes.length >= 32) {
                  if (firstBytes[0] === 0x1A && firstBytes[1] === 0x45 && firstBytes[2] === 0xDF && firstBytes[3] === 0xA3) {
                    const headerAscii = new TextDecoder('ascii', { fatal: false }).decode(firstBytes.slice(0, 48)).toLowerCase();
                    if (headerAscii.includes('webm')) {
                      return ['video/webm', ''];
                    }
                    return ['', 'video/mp4'];
                  }
                }
                if (e === '.mkv') return ['', 'video/mp4'];
                if (e === '.webm') return ['video/webm', ''];
                return ['video/mp4', ''];
              }

              // Verifies in an offscreen <video> probe that the browser's hardware/software decoder
              // actually decodes real video frames (totalVideoFrames > 0 AND videoWidth > 0)
              function probeCanDecodeRealVideoFrames(blob, expectVideoTrack, timeoutMs = 2800) {
                return new Promise((resolve) => {
                  const probeVideo = document.createElement('video');
                  probeVideo.muted = true;
                  probeVideo.playsInline = true;
                  probeVideo.preload = 'auto';
                  probeVideo.style.position = 'fixed';
                  probeVideo.style.left = '-9999px';
                  probeVideo.style.width = '64px';
                  probeVideo.style.height = '64px';
                  document.body.appendChild(probeVideo);

                  const url = URL.createObjectURL(blob);
                  let done = false;

                  const hasDecodedFrames = () => {
                    if (!expectVideoTrack) return probeVideo.readyState >= 2 && !probeVideo.error;
                    if (probeVideo.error) return false;
                    if (probeVideo.videoWidth <= 0 || probeVideo.videoHeight <= 0) return false;
                    if (typeof probeVideo.getVideoPlaybackQuality === 'function') {
                      const q = probeVideo.getVideoPlaybackQuality();
                      if (q && q.totalVideoFrames > 0) return true;
                    }
                    if (typeof probeVideo.webkitDecodedFrameCount === 'number') {
                      if (probeVideo.webkitDecodedFrameCount > 0) return true;
                    }
                    return probeVideo.readyState >= 3 && probeVideo.currentTime > 0.02;
                  };

                  const finish = (ok) => {
                    if (done) return;
                    done = true;
                    clearInterval(pollTimer);
                    clearTimeout(maxTimer);
                    try {
                      probeVideo.pause();
                      probeVideo.removeAttribute('src');
                      probeVideo.load();
                      probeVideo.remove();
                    } catch (e) {}
                    URL.revokeObjectURL(url);
                    resolve(ok);
                  };

                  const pollTimer = setInterval(() => {
                    if (probeVideo.error) {
                      finish(false);
                    } else if (hasDecodedFrames()) {
                      finish(true);
                    }
                  }, 80);

                  const maxTimer = setTimeout(() => {
                    finish(hasDecodedFrames());
                  }, timeoutMs);

                  probeVideo.onerror = () => finish(false);
                  probeVideo.onloadeddata = () => {
                    if (hasDecodedFrames()) {
                      finish(true);
                      return;
                    }
                    probeVideo.play().catch(() => {});
                  };

                  probeVideo.src = url;
                  probeVideo.load();
                });
              }

              function loadScriptOnce(src) {
                return new Promise((resolve, reject) => {
                  if (document.querySelector(`script[src="${src}"]`)) {
                    resolve();
                    return;
                  }
                  const s = document.createElement('script');
                  s.src = src;
                  s.onload = () => resolve();
                  s.onerror = () => reject(new Error('Failed to load compatibility script'));
                  document.head.appendChild(s);
                });
              }

              async function toSameOriginBlobUrl(url, mimeType) {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`Failed to fetch ${url}`);
                const buf = await resp.arrayBuffer();
                return URL.createObjectURL(new Blob([buf], { type: mimeType }));
              }

              async function convertToUniversalPlayableMp4(blobParts, ext, expectVideo, statusCallback) {
                statusCallback("Loading Universal Video Engine (0% internet upload)...");
                const ffmpegBase = "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd";
                const coreBase = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd";

                await loadScriptOnce(`${ffmpegBase}/ffmpeg.js`);

                if (!ffmpegInstance) {
                  const { FFmpeg } = window.FFmpegWASM;
                  ffmpegInstance = new FFmpeg();
                  ffmpegInstance.on('progress', ({ progress }) => {
                    const pct = Math.min(99, Math.max(1, Math.round((progress || 0) * 100)));
                    statusCallback(`Optimizing video for native playback... ${pct}%`);
                  });

                  const workerBlobUrl = await toSameOriginBlobUrl(`${ffmpegBase}/814.ffmpeg.js`, 'text/javascript');
                  const coreBlobUrl = await toSameOriginBlobUrl(`${coreBase}/ffmpeg-core.js`, 'text/javascript');
                  const wasmBlobUrl = await toSameOriginBlobUrl(`${coreBase}/ffmpeg-core.wasm`, 'application/wasm');

                  await ffmpegInstance.load({
                    classWorkerURL: workerBlobUrl,
                    coreURL: coreBlobUrl,
                    wasmURL: wasmBlobUrl
                  });
                }

                const inName = "input" + (ext || ".mkv");
                const remuxName = "remux.mp4";
                const transcodeName = "universal.mp4";

                const fullUint8 = new Uint8Array(await new Blob(blobParts).arrayBuffer());
                await ffmpegInstance.writeFile(inName, fullUint8);

                // Stage A: Fast lossless container remux into MP4 (if codec is already hardware-decodable H.264)
                statusCallback("Remuxing container to native MP4...");
                const ret1 = await ffmpegInstance.exec([
                  "-i", inName,
                  "-map", "0:v:0",
                  "-map", "0:a:0?",
                  "-c:v", "copy",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-movflags", "+faststart",
                  remuxName
                ]);

                if (ret1 === 0) {
                  try {
                    const data1 = await ffmpegInstance.readFile(remuxName);
                    await ffmpegInstance.deleteFile(remuxName).catch(() => {});
                    if (data1 && data1.byteLength > 1024) {
                      const remuxBlob = new Blob([data1.buffer], { type: 'video/mp4' });
                      const canDecodeRemux = await probeCanDecodeRealVideoFrames(remuxBlob, expectVideo, 2500);
                      if (canDecodeRemux) {
                        await ffmpegInstance.deleteFile(inName).catch(() => {});
                        return remuxBlob;
                      }
                    }
                  } catch (e) {}
                }

                // Stage B: Full Universal 8-bit H.264 (yuv420p) + AAC transcode (fixes HEVC / H.265 / 10-bit Hi10P)
                statusCallback("Converting video codec to Universal H.264 MP4...");
                const ret2 = await ffmpegInstance.exec([
                  "-i", inName,
                  "-map", "0:v:0",
                  "-map", "0:a:0?",
                  "-c:v", "libx264",
                  "-preset", "ultrafast",
                  "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  "-vf", "scale=trunc(iw/2)*2:trunc(ih/2)*2",
                  "-c:a", "aac",
                  "-ac", "2",
                  "-b:a", "128k",
                  "-movflags", "+faststart",
                  transcodeName
                ]);

                await ffmpegInstance.deleteFile(inName).catch(() => {});

                if (ret2 === 0) {
                  const data2 = await ffmpegInstance.readFile(transcodeName);
                  await ffmpegInstance.deleteFile(transcodeName).catch(() => {});
                  if (data2 && data2.byteLength > 1024) {
                    return new Blob([data2.buffer], { type: 'video/mp4' });
                  }
                }
                throw new Error("Could not convert video stream.");
              }

              async function handleDecryptAndWatch() {
                const rawKey = document.getElementById('viewerKeyInput').value.trim().toUpperCase();
                if (!rawKey) {
                  alert("Please paste your One-Time Key or Permanent Masterkey.");
                  return;
                }

                if (!selectedVlockFile) {
                  autoPlayPendingAfterPick = true;
                  document.getElementById('vlockFileInput').click();
                  return;
                }

                const btn = document.getElementById('btnDecryptWatch');
                const modalBtn = document.getElementById('btnModalDecryptWatch');
                const setBtnsText = (txt, disabled) => {
                  btn.disabled = disabled;
                  btn.textContent = txt;
                  if (modalBtn) {
                    modalBtn.disabled = disabled;
                    modalBtn.textContent = txt;
                  }
                };

                setBtnsText("Verifying Key & Decrypting...", true);

                try {
                  const enc = new TextEncoder();
                  const kBytes = enc.encode(rawKey);
                  const targetKeyId = (await sha256Bytes(kBytes)).slice(0, 15);
                  const wrapMask = await sha256Bytes(concatBytes(kBytes, enc.encode("VLOCK_WRAP")));

                  const probeLen = Math.min(selectedVlockFile.size, 1024 * 1024);
                  let probeBytes;
                  try {
                    probeBytes = new Uint8Array(await selectedVlockFile.slice(0, probeLen).arrayBuffer());
                  } catch (readErr) {
                    selectedVlockFile = null;
                    autoPlayPendingAfterPick = true;
                    document.getElementById('vlockFileInput').click();
                    return;
                  }

                  let vlockStart = -1;
                  for (let i = 0; i <= probeBytes.length - 6; i++) {
                    const ver = (probeBytes[i + 4] << 8) | probeBytes[i + 5];
                    if (
                      probeBytes[i] === 0x56 &&
                      probeBytes[i + 1] === 0x4C &&
                      probeBytes[i + 2] === 0x43 &&
                      probeBytes[i + 3] === 0x4B &&
                      (ver === 1 || ver === 2)
                    ) {
                      vlockStart = i;
                      break;
                    }
                  }
                  if (vlockStart === -1) {
                    throw new Error("Not a valid VLock encrypted file.");
                  }

                  const headBuf = await selectedVlockFile.slice(vlockStart, vlockStart + 66).arrayBuffer();
                  const headBytes = new Uint8Array(headBuf);

                  const dv = new DataView(headBuf);
                  const version = dv.getUint16(4, false);
                  let ext = ".mp4", nonce8, verifyHash, numKeys, fixedLen;

                  if (version === 1) {
                    ext = new TextDecoder().decode(headBytes.slice(6, 14)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headBytes.slice(14, 22);
                    verifyHash = headBytes.slice(22, 54);
                    numKeys = dv.getUint32(54, false);
                    fixedLen = 58;
                  } else if (version === 2) {
                    ext = new TextDecoder().decode(headBytes.slice(6, 22)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headBytes.slice(22, 30);
                    verifyHash = headBytes.slice(30, 62);
                    numKeys = dv.getUint32(62, false);
                    fixedLen = 66;
                  } else {
                    throw new Error("Unsupported format version: " + version);
                  }

                  const slotsStart = vlockStart + fixedLen;
                  const payloadOffset = slotsStart + (numKeys * SLOT_SIZE);
                  const payloadSize = selectedVlockFile.size - payloadOffset;
                  const slotsData = new Uint8Array(await selectedVlockFile.slice(slotsStart, payloadOffset).arrayBuffer());

                  let matchedIdx = -1, slotStatus = 0, wrappedMk = null;
                  for (let i = 0; i < numKeys; i++) {
                    const off = i * SLOT_SIZE;
                    let same = true;
                    for (let b = 0; b < 15; b++) {
                      if (slotsData[off + 1 + b] !== targetKeyId[b]) { same = false; break; }
                    }
                    if (same) {
                      matchedIdx = i;
                      slotStatus = slotsData[off];
                      wrappedMk = slotsData.slice(off + 16, off + 48);
                      break;
                    }
                  }

                  if (matchedIdx === -1) {
                    throw new Error("Invalid Decryption Key! Please check the key from the Telegram Bot.");
                  }

                  const keyHex = bytesToHex(targetKeyId);
                  const burnedKeys = JSON.parse(localStorage.getItem('vlock_burned_keys') || '{}');
                  if (slotStatus === 0 || (slotStatus === 1 && burnedKeys[keyHex])) {
                    throw new Error("Previous key expired! Please enter a new key from the Telegram Bot to watch again.");
                  }

                  const masterKey = new Uint8Array(32);
                  for (let i = 0; i < 32; i++) masterKey[i] = wrappedMk[i] ^ wrapMask[i];

                  const checkHash = await sha256Bytes(concatBytes(masterKey, enc.encode("VLOCK_VERIFY")));
                  if (bytesToHex(checkHash) !== bytesToHex(verifyHash)) {
                    throw new Error("Key verification failed.");
                  }

                  const cryptoKey = await crypto.subtle.importKey('raw', masterKey, 'AES-CTR', false, ['decrypt']);

                  // Decrypt in fast 16 MB local memory chunks
                  const blobParts = [];
                  const chunkSize = 16 * 1024 * 1024;
                  let offset = 0;
                  let firstChunkBytes = null;

                  while (offset < payloadSize) {
                    const len = Math.min(chunkSize, payloadSize - offset);
                    const encChunk = await selectedVlockFile.slice(payloadOffset + offset, payloadOffset + offset + len).arrayBuffer();
                    const decChunk = await crypto.subtle.decrypt(
                      { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                      cryptoKey,
                      encChunk
                    );
                    if (!firstChunkBytes) {
                      firstChunkBytes = new Uint8Array(decChunk.slice(0, 64));
                    }
                    blobParts.push(decChunk);
                    offset += len;
                    const pct = Math.min(100, Math.round((offset / payloadSize) * 100));
                    setBtnsText(`Decrypting Video... ${pct}%`, true);
                  }

                  if (slotStatus === 2) {
                    document.getElementById('instantKeyModal').classList.remove('show');
                    const outName = `${selectedVlockFile.name.replace(/\.(html|htm|vlock)$/i, '')}_Unlocked${ext}`;
                    await saveBlobToDisk(new Blob(blobParts, { type: 'application/octet-stream' }), outName);
                    alert("Permanent Masterkey Verified!\n\nVideo unlocked forever and restored to its original format: " + outName);
                    return;
                  }

                  setBtnsText("Verifying Native Video Decoder...", true);

                  const expectVideo = !isAudioOnlyExt(ext);
                  const candidateMimes = getCandidateMimes(ext, firstChunkBytes);
                  let playableBlob = null;

                  // Stage 1: Probe whether the device hardware decoder actually decodes real video frames (totalVideoFrames > 0)
                  for (const mime of candidateMimes) {
                    const testBlob = mime ? new Blob(blobParts, { type: mime }) : new Blob(blobParts);
                    const ok = await probeCanDecodeRealVideoFrames(testBlob, expectVideo, 2500);
                    if (ok) {
                      playableBlob = testBlob;
                      break;
                    }
                  }

                  // Stage 2: If 0 frames decoded (e.g. MKV/HEVC/10-bit H.264), convert via same-origin FFmpeg.wasm into Universal H.264 MP4
                  if (!playableBlob) {
                    playableBlob = await convertToUniversalPlayableMp4(blobParts, ext, expectVideo, (msg) => setBtnsText(msg, true));
                  }

                  // Burn temporary key only after playable stream is ready
                  burnedKeys[keyHex] = Date.now();
                  localStorage.setItem('vlock_burned_keys', JSON.stringify(burnedKeys));

                  const videoEl = document.getElementById('vlockVideoPlayer');
                  videoEl.pause();
                  if (currentObjectUrl) {
                    URL.revokeObjectURL(currentObjectUrl);
                    currentObjectUrl = null;
                  }

                  currentObjectUrl = URL.createObjectURL(playableBlob);
                  document.getElementById('playerWrap').classList.add('active');
                  document.getElementById('instantKeyModal').classList.remove('show');

                  videoEl.src = currentObjectUrl;
                  videoEl.load();
                  videoEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                  await videoEl.play().catch(() => {});
                } catch (err) {
                  alert(err.message);
                } finally {
                  setBtnsText("▶ Decrypt & Watch / Unlock", false);
                  if (modalBtn) modalBtn.textContent = "▶ Decrypt & Watch Now";
                }
              }

              async function saveBlobToDisk(blob, filename) {
                if (customDirectoryHandle) {
                  try {
                    const fh = await customDirectoryHandle.getFileHandle(filename, { create: true });
                    const wr = await fh.createWritable();
                    await wr.write(blob);
                    await wr.close();
                    return;
                  } catch (e) {}
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
              }

              function generateHumanKey(prefix) {
                const alpha = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
                const rnd = crypto.getRandomValues(new Uint8Array(12));
                let g1 = "", g2 = "", g3 = "";
                for (let i = 0; i < 4; i++) {
                  g1 += alpha[rnd[i] % alpha.length];
                  g2 += alpha[rnd[i + 4] % alpha.length];
                  g3 += alpha[rnd[i + 8] % alpha.length];
                }
                return `${prefix}-${g1}-${g2}-${g3}`;
              }

              async function handleStartEncryption() {
                refreshAdminLockUI();
                if (document.getElementById('adminUnlockedSection').style.display === 'none') {
                  alert("Admin Encryption Panel is locked.");
                  return;
                }
                if (!selectedRawMediaFile) {
