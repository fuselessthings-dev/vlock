                --red-banner: #42141b;
                --red-border: #da3633;
                --red-bright: #ff7b72;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
              body { background: var(--bg-dark); color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }

              .topbar {
                background: var(--header-bg); padding: 11px 18px; display: flex; align-items: center;
                justify-content: space-between; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100;
                flex-wrap: wrap; gap: 10px;
              }
              .brand { display: flex; align-items: center; gap: 10px; }
              .brand h1 { font-size: 19px; font-weight: 800; color: #ffffff; }
              .brand span { font-size: 12px; color: #8b949e; display: none; }
              @media (min-width: 640px) { .brand span { display: inline; } }

              .top-actions { display: flex; align-items: center; gap: 7px; position: relative; flex-wrap: wrap; }

              .btn {
                border: none; border-radius: 7px; padding: 8px 13px; font-size: 12.5px; font-weight: 700;
                cursor: pointer; color: #ffffff; transition: opacity 0.15s, transform 0.1s;
                display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none;
