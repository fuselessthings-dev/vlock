            <script>
              const ZK_SALT_HEX = "__ZK_SALT_HEX__";
              const ZK_VERIFIER_HEX = "__ZK_VERIFIER_HEX__";
              const ZK_ENC_D_HEX = "__ZK_ENC_D_HEX__";
              const ZK_PUB_X_B64U = "__ZK_PUB_X_B64U__";
              const ZK_PUB_Y_B64U = "__ZK_PUB_Y_B64U__";
              const SLOT_SIZE = 48;

              const CODE_TO_SECONDS = { "1D": 86400, "1W": 7 * 86400, "1M": 30 * 86400, "1Y": 365 * 86400, "LT": -1 };
              const CODE_TO_LABEL = { "1D": "1 Day", "1W": "1 Week", "1M": "1 Month", "1Y": "1 Year", "LT": "Lifetime" };

              let selectedVlockFile = null;
              let selectedRawMediaFile = null;
              let customDirectoryHandle = null;
              let lastGeneratedKeysContent = "";
              let verifiedSuPassword = "";
              let currentObjectUrl = null;
              let autoPlayPendingAfterPick = false;
              let ffmpegInstance = null;

              // Immediately remove any old Service Workers so virtual stream bugs never occur
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then((regs) => {
                  for (const reg of regs) reg.unregister();
                }).catch(() => {});
              }

              function hexToBytes(hex) {
                const out = new Uint8Array(hex.length / 2);
                for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
                return out;
              }

              function bytesToHex(bytes) {
                return Array.from(new Uint8Array(bytes)).map(b => b.toString(16).padStart(2, '0')).join('');
              }

              function bytesToBase64Url(bytes) {
                let bin = "";
                const arr = new Uint8Array(bytes);
                for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
              }

              function concatBytes(a, b) {
                const out = new Uint8Array(a.length + b.length);
                out.set(a, 0);
                out.set(b, a.length);
                return out;
              }

              async function sha256Bytes(data) {
                return new Uint8Array(await crypto.subtle.digest('SHA-256', data));
              }

              function makeCtrIv(nonce8, blockIndex) {
                const iv = new Uint8Array(16);
                iv.set(nonce8.slice(0, 8), 0);
                const dv = new DataView(iv.buffer);
                dv.setUint32(8, Math.floor(blockIndex / 4294967296), false);
                dv.setUint32(12, blockIndex >>> 0, false);
                return iv;
              }

              const B32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
              function base32Encode(bytes) {
                let out = "", buf = 0, bits = 0;
                for (let i = 0; i < bytes.length; i++) {
                  buf = (buf << 8) | bytes[i];
                  bits += 8;
                  while (bits >= 5) {
                    out += B32_ALPHABET[(buf >>> (bits - 5)) & 31];
                    bits -= 5;
                  }
                }
                if (bits > 0) out += B32_ALPHABET[(buf << (5 - bits)) & 31];
                return out;
              }

              function base32Decode(str) {
                const out = [];
                let buf = 0, bits = 0;
                for (let i = 0; i < str.length; i++) {
                  const v = B32_ALPHABET.indexOf(str[i]);
                  if (v < 0) continue;
                  buf = (buf << 5) | v;
                  bits += 5;
                  if (bits >= 8) {
                    out.push((buf >>> (bits - 8)) & 255);
                    bits -= 8;
                  }
                }
                return new Uint8Array(out);
              }

              async function deriveZkKdf(passwordStr) {
                const enc = new TextEncoder();
                const baseKey = await crypto.subtle.importKey('raw', enc.encode(passwordStr), 'PBKDF2', false, ['deriveBits']);
                const bits = await crypto.subtle.deriveBits(
                  { name: 'PBKDF2', salt: hexToBytes(ZK_SALT_HEX), iterations: 200000, hash: 'SHA-256' },
                  baseKey,
                  256
                );
                return new Uint8Array(bits);
              }

              // =========================================================================
              // INDEXEDDB CACHE FOR REDIRECTED .HTML FILES
              // =========================================================================
              function saveVideoToIndexedDb(filename, blob) {
                return new Promise((resolve) => {
                  try {
                    const req = indexedDB.open('vlock_instant_db', 1);
                    req.onupgradeneeded = (e) => {
                      const db = e.target.result;
                      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media');
                    };
                    req.onsuccess = (e) => {
                      try {
                        const db = e.target.result;
                        const tx = db.transaction('media', 'readwrite');
                        const store = tx.objectStore('media');
                        store.put({ name: filename, blob: blob }, 'latest');
                        if (filename) store.put({ name: filename, blob: blob }, filename);
                        tx.oncomplete = () => { db.close(); resolve(); };
                        tx.onerror = () => { db.close(); resolve(); };
                      } catch (err) { resolve(); }
                    };
                    req.onerror = () => resolve();
                  } catch (e) { resolve(); }
                });
              }

              function getVideoFromIndexedDb(filename) {
                return new Promise((resolve) => {
                  try {
                    const req = indexedDB.open('vlock_instant_db', 1);
                    req.onupgradeneeded = (e) => {
                      const db = e.target.result;
                      if (!db.objectStoreNames.contains('media')) db.createObjectStore('media');
                    };
                    req.onsuccess = (e) => {
                      const db = e.target.result;
                      if (!db.objectStoreNames.contains('media')) { db.close(); resolve(null); return; }
                      const tx = db.transaction('media', 'readonly');
                      const store = tx.objectStore('media');
                      const key = filename || 'latest';
                      const g = store.get(key);
                      g.onsuccess = () => {
                        if (g.result && g.result.blob) {
                          const b = g.result.blob;
                          b.name = g.result.name || filename || 'Video.html';
                          db.close();
                          resolve(b);
                        } else if (key !== 'latest') {
                          const g2 = store.get('latest');
                          g2.onsuccess = () => {
                            db.close();
                            if (g2.result && g2.result.blob) {
                              const b = g2.result.blob;
                              b.name = g2.result.name || 'Video.html';
                              resolve(b);
                            } else resolve(null);
                          };
                          g2.onerror = () => { db.close(); resolve(null); };
                        } else {
                          db.close();
                          resolve(null);
                        }
                      };
                      g.onerror = () => { db.close(); resolve(null); };
                    };
                    req.onerror = () => resolve(null);
                  } catch (e) { resolve(null); }
                });
              }

              function onVlockFilePicked(file, showPopup = true) {
                if (!file) return;
                selectedVlockFile = file;
                saveVideoToIndexedDb(file.name, file);
                const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
                document.getElementById('viewerFileTitle').textContent = `Ready to Unlock: ${file.name} (${sizeMb} MB)`;

                const currentKey = document.getElementById('viewerKeyInput').value.trim();
                if (autoPlayPendingAfterPick && currentKey) {
                  autoPlayPendingAfterPick = false;
                  handleDecryptAndWatch();
                  return;
                }

                if (showPopup) {
                  document.getElementById('instantKeyModalFileLabel').textContent = `🎬 Ready to Play: ${file.name} (${sizeMb} MB)`;
                  document.getElementById('instantKeyModal').classList.add('show');
                  setTimeout(() => {
                    const modalInput = document.getElementById('modalViewerKeyInput');
                    if (modalInput) modalInput.focus();
                  }, 60);
                }
              }

              async function checkRedirectedVideoLaunch() {
                const params = new URLSearchParams(window.location.search);
                if (!params.has('play') && !params.has('auto_unlock')) return;

                const targetName = params.get('play') || params.get('file') || '';
                window.history.replaceState({}, document.title, window.location.pathname);

                const cached = await getVideoFromIndexedDb(targetName);
                if (cached) {
                  selectedVlockFile = cached;
                  const sizeMb = (cached.size / (1024 * 1024)).toFixed(1);
                  document.getElementById('viewerFileTitle').textContent = `Ready to Unlock: ${cached.name} (${sizeMb} MB)`;
                  document.getElementById('instantKeyModalFileLabel').textContent = `🎬 Ready to Play: ${cached.name} (${sizeMb} MB)`;
                } else {
                  document.getElementById('instantKeyModalFileLabel').textContent = targetName
                    ? `🎬 Opening "${targetName}" — Paste your key & tap Decrypt & Watch:`
                    : `🎬 Paste your Decryption Key below to unlock & play your video:`;
                }

                document.getElementById('instantKeyModal').classList.add('show');
                setTimeout(() => {
                  const modalInput = document.getElementById('modalViewerKeyInput');
                  if (modalInput) modalInput.focus();
                }, 60);
              }

              function onRawMediaPicked(file) {
                if (!file) return;
                selectedRawMediaFile = file;
                const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
                document.getElementById('encryptFileTitle').textContent = `Selected: ${file.name} (${sizeMb} MB)`;
              }

              function bindDropZone(zoneId, inputId, callback) {
                const zone = document.getElementById(zoneId);
                const input = document.getElementById(inputId);
                zone.addEventListener('click', () => input.click());
                input.addEventListener('change', () => {
                  if (input.files && input.files.length > 0) callback(input.files[0]);
                });
                zone.addEventListener('dragover', (e) => {
                  e.preventDefault();
                  zone.classList.add('dragover');
                });
                zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
                zone.addEventListener('drop', (e) => {
                  e.preventDefault();
                  zone.classList.remove('dragover');
                  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    callback(e.dataTransfer.files[0]);
                  }
                });
              }

              async function pasteIntoField(inputId) {
                const el = document.getElementById(inputId);
                el.focus();
                try {
                  if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                      el.value = text.trim();
                      return;
                    }
                  }
                } catch (e) {}
                const manual = prompt("Paste your key here:");
                if (manual !== null && manual.trim() !== "") {
                  el.value = manual.trim();
