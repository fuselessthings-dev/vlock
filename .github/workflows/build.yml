              .nle-text p { font-size: 11px; color: #c9d1d9; line-height: 1.4; }

              .input-row { display: flex; gap: 8px; align-items: stretch; }
              .input-box {
                flex: 1; background: #071710; border: 1px solid var(--green-border); border-radius: 8px;
