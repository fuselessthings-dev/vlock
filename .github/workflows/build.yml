          '''

          index_html = index_html.replace("__ZK_SALT_HEX__", salt.hex())
          index_html = index_html.replace("__ZK_VERIFIER_HEX__", verifier)
          index_html = index_html.replace("__ZK_ENC_D_HEX__", enc_d_hex)
          index_html = index_html.replace("__ZK_PUB_X_B64U__", pub_x_b64u)
