name: Deploy VLock Online Web App & Redirectors

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-web-app:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Set up JDK 17 (For Android .vlock Lock Icon & Website Redirector APK)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Android .vlock Website Redirector APK (With Built-in Android Lock Icon)
        run: |
          set -e
          mkdir -p dist_web
          mkdir -p /tmp/vlock_redirect/src/com/vlock/app
          cd /tmp/vlock_redirect

          ANDROID_JAR=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.vlock.app"
              android:versionCode="5"
              android:versionName="2.5.0">

              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />

              <!-- Uses Android's Built-in System Padlock Icon (@android:drawable/ic_lock_lock) -->
              <application
                  android:label="VLock (.vlock Opener)"
                  android:icon="@android:drawable/ic_lock_lock"
                  android:theme="@android:style/Theme.DeviceDefault.Dialog.NoActionBar">

                  <activity
                      android:name="com.vlock.app.MainActivity"
                      android:label="Open with VLock Website"
                      android:icon="@android:drawable/ic_lock_lock"
                      android:exported="true"
                      android:launchMode="singleTask">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <!-- Catch .vlock taps with NO MIME type -->
                      <intent-filter android:label="Open in VLock Website" android:icon="@android:drawable/ic_lock_lock" android:priority="999">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                      </intent-filter>

                      <!-- Catch explicit .vlock files across all folders -->
                      <intent-filter android:label="Open in VLock Website" android:icon="@android:drawable/ic_lock_lock" android:priority="999">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:host="*" />
                          <data android:mimeType="*/*" />
                          <data android:pathPattern=".*\\.vlock" />
                          <data android:pathPattern=".*\\..*\\.vlock" />
                          <data android:pathPattern=".*\\..*\\..*\\.vlock" />
                          <data android:pathPattern=".*\\..*\\..*\\..*\\.vlock" />
                          <data android:pathPattern=".*\\.VLOCK" />
                      </intent-filter>

                      <!-- Catch Telegram & File Manager "Open as" categories -->
                      <intent-filter android:label="Open in VLock Website" android:icon="@android:drawable/ic_lock_lock" android:priority="999">
                          <action android:name="android.intent.action.VIEW" />
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="file" />
                          <data android:scheme="content" />
                          <data android:mimeType="*/*" />
                          <data android:mimeType="application/*" />
                          <data android:mimeType="application/octet-stream" />
                          <data android:mimeType="video/*" />
                          <data android:mimeType="audio/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/vlock/app/MainActivity.java
          package com.vlock.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;

          public class MainActivity extends Activity {
              private static final String WEB_URL = "https://fuselessthings-dev.github.io/vlock/";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handleIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  handleIntent(intent);
              }

              private String getFileName(Uri uri) {
                  if (uri == null) return "";
                  String res = null;
                  if ("content".equals(uri.getScheme())) {
                      Cursor c = null;
                      try {
                          c = getContentResolver().query(uri, null, null, null, null);
                          if (c != null && c.moveToFirst()) {
                              int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                              if (idx >= 0) res = c.getString(idx);
                          }
                      } catch (Exception ignored) {
                      } finally {
                          if (c != null) c.close();
                      }
                  }
                  if (res == null) res = uri.getLastPathSegment();
                  return res != null ? res : "Video.vlock";
              }

              private void handleIntent(Intent intent) {
                  Uri uri = intent != null ? intent.getData() : null;
                  if (uri == null && intent != null && Intent.ACTION_SEND.equals(intent.getAction())) {
                      uri = (Uri) intent.getParcelableExtra(Intent.EXTRA_STREAM);
                  }
                  final String fileName = getFileName(uri);
                  final String targetUrl = fileName.isEmpty()
                          ? WEB_URL
                          : WEB_URL + "?file=" + Uri.encode(fileName);

                  if (uri != null) {
                      new AlertDialog.Builder(this)
                              .setIcon(android.R.drawable.ic_lock_lock)
                              .setTitle("🔒 VLock Encrypted Video")
                              .setMessage("File: " + fileName + "\n\nRedirect to the VLock Website to paste your key and watch online?")
                              .setPositiveButton("🌐 Open VLock Website", new DialogInterface.OnClickListener() {
                                  @Override
                                  public void onClick(DialogInterface d, int w) {
                                      openWebsite(targetUrl);
                                      finish();
                                  }
                              })
                              .setNegativeButton("Cancel", new DialogInterface.OnClickListener() {
                                  @Override
                                  public void onClick(DialogInterface d, int w) {
                                      finish();
                                  }
                              })
                              .setOnCancelListener(new DialogInterface.OnCancelListener() {
                                  @Override
                                  public void onCancel(DialogInterface d) {
                                      finish();
                                  }
                              })
                              .show();
                  } else {
                      openWebsite(WEB_URL);
                      finish();
                  }
              }

              private void openWebsite(String url) {
                  try {
                      Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(browserIntent);
                  } catch (Exception ignored) {}
              }
          }
          EOF

          $BUILD_TOOLS/aapt2 link -o unaligned.apk --manifest AndroidManifest.xml -I "$ANDROID_JAR" --java gen
          mkdir -p obj
          javac -g:none -source 1.8 -target 1.8 -bootclasspath "$ANDROID_JAR" -classpath "$ANDROID_JAR" -d obj src/com/vlock/app/MainActivity.java gen/com/vlock/app/R.java
          jar cf classes.jar -C obj .
          $BUILD_TOOLS/d8 --release --lib "$ANDROID_JAR" --min-api 26 --output . classes.jar
          zip -uj unaligned.apk classes.dex
          $BUILD_TOOLS/zipalign -f -p 4 unaligned.apk aligned.apk

          keytool -genkeypair -v -keystore release.keystore -storepass VLockStudio2026 -alias vlock_release -keypass VLockStudio2026 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VLock Studio,OU=Media Security,O=VLock Studio,L=Global,ST=Global,C=US"
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:VLockStudio2026 --key-pass pass:VLockStudio2026 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$GITHUB_WORKSPACE/dist_web/VLock_Android.apk" aligned.apk

      - name: Build VLock Web App, Windows Lock-Icon Setup & Visual Tutorial
        env:
          SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
        run: |
          pip install cryptography>=42.0.0

          python3 - << 'PYEOF'
          import os, base64, hashlib
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.backends import default_backend

          secret_pwd = os.environ.get("SUPERUSER_PASSWORD", "").strip()
          if secret_pwd:
              _k = secret_pwd.encode("utf-8")
          else:
              _k = bytes([c ^ 0x5A for c in [24, 53, 54, 62, 63, 40, 107, 104, 105, 110, 111, 26]])

          salt = hashlib.sha256(b"VLOCK_DETERMINISTIC_SALT_2026_MODRAT").digest()[:16]
          kdf = hashlib.pbkdf2_hmac("sha256", _k, salt, 200000, dklen=32)
          verifier = hashlib.sha256(kdf + b"VLOCK_SU_AUTH_v2").hexdigest()

          scalar_bytes = hashlib.pbkdf2_hmac("sha256", kdf + b"ECDSA_P256_KEY", salt, 10000, dklen=32)
          private_value = int.from_bytes(scalar_bytes, "big") % (
              0xFFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632551 - 1
          ) + 1
          priv_key = ec.derive_private_key(private_value, ec.SECP256R1(), default_backend())
          priv_nums = priv_key.private_numbers()
          pub_nums = priv_nums.public_numbers

          def to_b64u(val_int):
              raw32 = val_int.to_bytes(32, "big")
              return base64.urlsafe_b64encode(raw32).decode("ascii").rstrip("=")

          pub_x_b64u = to_b64u(pub_nums.x)
          pub_y_b64u = to_b64u(pub_nums.y)
          d_raw32 = priv_nums.private_value.to_bytes(32, "big")

          cipher = Cipher(algorithms.AES(kdf), modes.CTR(salt[:8] + b"\x00" * 8), backend=default_backend())
          enc = cipher.encryptor()
          enc_d_hex = (enc.update(d_raw32) + enc.finalize()).hex()

          # 1. Generate Windows .vlock Gold Padlock Icon + Website Auto-Redirect Script
          win_bat = (
              "@echo off\r\n"
              "title VLock Windows Lock Icon & Website Redirect Setup\r\n"
              "echo Setting Windows Built-in Locked Padlock Icon for .vlock files...\r\n"
              "reg add \"HKCU\\Software\\Classes\\.vlock\" /ve /d \"VLock.EncryptedMedia.v2\" /f >nul\r\n"
              "reg add \"HKCU\\Software\\Classes\\VLock.EncryptedMedia.v2\" /ve /d \"VLock Encrypted Video File\" /f >nul\r\n"
              "reg add \"HKCU\\Software\\Classes\\VLock.EncryptedMedia.v2\\DefaultIcon\" /ve /t REG_EXPAND_SZ /d \"%%SystemRoot%%\\System32\\shell32.dll,-48\" /f >nul\r\n"
              "reg add \"HKCU\\Software\\Classes\\VLock.EncryptedMedia.v2\\shell\\open\\command\" /ve /d \"cmd.exe /c start \\\"\\\" \\\"https://fuselessthings-dev.github.io/vlock/?file=%%~nx1\\\"\" /f >nul\r\n"
              "reg delete \"HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\FileExts\\.vlock\\UserChoice\" /f >nul 2>&1\r\n"
              "ie4uinit.exe -show\r\n"
              "echo.\r\n"
              "echo SUCCESS! All .vlock files now display the Windows Padlock Icon and open the VLock Website when double-clicked!\r\n"
              "pause\r\n"
          )
          with open("dist_web/VLock_Windows_Redirect.bat", "w", encoding="utf-8") as f:
              f.write(win_bat)

          # 2. Generate SVG Lock Icon for Web App & File Handler
          lock_svg = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
            <rect width="192" height="192" rx="38" fill="#0d1117"/>
            <rect x="8" y="8" width="176" height="176" rx="32" fill="none" stroke="#3fb950" stroke-width="6"/>
            <path d="M62 84V62c0-18.8 15.2-34 34-34s34 15.2 34 34v22" fill="none" stroke="#f0b72f" stroke-width="14" stroke-linecap="round"/>
            <rect x="44" y="84" width="104" height="78" rx="16" fill="#f0b72f"/>
            <circle cx="96" cy="116" r="10" fill="#0d1117"/>
            <path d="M96 124v18" stroke="#0d1117" stroke-width="8" stroke-linecap="round"/>
          </svg>'''
          with open("dist_web/lock-icon.svg", "w", encoding="utf-8") as f:
              f.write(lock_svg)

          # 3. Generate PWA Manifest with File Handlers (.vlock Auto-Open in Chrome/Edge)
          manifest_json = '''{
            "name": "VLock Video Unlocker & Admin Studio",
            "short_name": "VLock",
            "description": "Decrypt and watch .vlock videos online with zero data upload.",
            "start_url": "./index.html",
            "display": "standalone",
            "background_color": "#0d1117",
            "theme_color": "#161b22",
            "icons": [
              {
                "src": "./lock-icon.svg",
                "sizes": "192x192 512x512",
                "type": "image/svg+xml",
                "purpose": "any maskable"
              }
            ],
            "file_handlers": [
              {
                "action": "./index.html",
                "accept": {
                  "application/vnd.vlock": [".vlock"],
                  "application/octet-stream": [".vlock"]
                },
                "icons": [
                  {
                    "src": "./lock-icon.svg",
                    "sizes": "192x192",
                    "type": "image/svg+xml"
                  }
                ],
                "launch_type": "single-client"
              }
            ]
          }'''
          with open("dist_web/manifest.json", "w", encoding="utf-8") as f:
              f.write(manifest_json)

          # 4. Generate Service Worker
          sw_js = r'''self.addEventListener('install', (event) => {
            self.skipWaiting();
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(self.clients.claim());
          });

          self.addEventListener('fetch', (event) => {
            const url = new URL(event.request.url);
            if (!url.pathname.includes('/__vlock_stream__/')) return;

            event.respondWith((async () => {
              const sid = url.searchParams.get('sid') || '';
              const totalSize = parseInt(url.searchParams.get('size') || '0', 10);
              const mime = url.searchParams.get('mime') || 'video/mp4';
              const rangeHeader = event.request.headers.get('Range');

              let start = 0;
              let end = totalSize - 1;
              let isPartial = false;

              if (rangeHeader && rangeHeader.startsWith('bytes=')) {
                isPartial = true;
                const parts = rangeHeader.replace('bytes=', '').split('-');
                if (parts[0]) start = parseInt(parts[0], 10);
                if (parts[1]) end = Math.min(totalSize - 1, parseInt(parts[1], 10));
              }

              const maxChunk = 1024 * 1024;
              if (end - start + 1 > maxChunk) {
                end = start + maxChunk - 1;
                isPartial = true;
              }

              const clientsList = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
              if (!clientsList || clientsList.length === 0) {
                return new Response('Stream closed', { status: 404 });
              }

              const chunkBuffer = await new Promise((resolve, reject) => {
                const channel = new MessageChannel();
                const timer = setTimeout(() => reject(new Error('Stream timeout')), 15000);
                channel.port1.onmessage = (e) => {
                  clearTimeout(timer);
                  if (e.data && e.data.ok) resolve(e.data.buffer);
                  else reject(new Error('Read error'));
                };
                clientsList[0].postMessage({ type: 'VLOCK_STREAM_PULL', sid, start, end }, [channel.port2]);
              });

              const byteLen = chunkBuffer.byteLength;
              const headers = new Headers({
                'Content-Type': mime,
                'Accept-Ranges': 'bytes',
                'Content-Length': String(byteLen),
                'Cache-Control': 'no-store'
              });
              if (isPartial) {
                headers.set('Content-Range', `bytes ${start}-${start + byteLen - 1}/${totalSize}`);
              }
              return new Response(chunkBuffer, { status: isPartial ? 206 : 200, headers });
            })());
          });
          '''
          with open("dist_web/sw.js", "w", encoding="utf-8") as f:
              f.write(sw_js)

          # 5. Generate Complete VLock Website with Visual Illustrated Tutorial
          index_html = r'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>VLock — User Decryption & Admin Encryption</title>
            <link rel="manifest" href="./manifest.json" />
            <link rel="icon" type="image/svg+xml" href="./lock-icon.svg" />
            <style>
