                const gAdmin = document.getElementById('tutGridAdmin');
                const gSess = document.getElementById('tutGridSession');

                bUser.className = 'tab-btn';
                bAdmin.className = 'tab-btn';
                bSess.className = 'tab-btn';
                gUser.style.display = 'none';
                gAdmin.style.display = 'none';
                gSess.style.display = 'none';

                if (mode === 'user') {
                  bUser.classList.add('active-green');
                  gUser.style.display = 'grid';
                } else if (mode === 'admin') {
                  bAdmin.classList.add('active-red');
                  gAdmin.style.display = 'grid';
                } else {
                  bSess.classList.add('active-blue');
                  gSess.style.display = 'grid';
                }
              }

