                0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
                0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
                0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
                0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
                0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
                0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
              ]);

              function sha256PureJs(msgBytes) {
                const ml = msgBytes.length;
                const bitLenHi = Math.floor((ml * 8) / 4294967296);
                const bitLenLo = (ml * 8) >>> 0;
                const padLen = ((ml + 9 + 63) & ~63);
                const buf = new Uint8Array(padLen);
                buf.set(msgBytes, 0);
                buf[ml] = 0x80;
                const dv = new DataView(buf.buffer);
                dv.setUint32(padLen - 8, bitLenHi, false);
                dv.setUint32(padLen - 4, bitLenLo, false);

                let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a;
                let h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
                const w = new Uint32Array(64);

                for (let off = 0; off < padLen; off += 64) {
                  for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4, false);
                  for (let i = 16; i < 64; i++) {
                    const v0 = w[i - 15], v1 = w[i - 2];
                    const s0 = ((v0 >>> 7) | (v0 << 25)) ^ ((v0 >>> 18) | (v0 << 14)) ^ (v0 >>> 3);
                    const s1 = ((v1 >>> 17) | (v1 << 15)) ^ ((v1 >>> 19) | (v1 << 13)) ^ (v1 >>> 10);
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                  }
                  let a = h0, b = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
                  for (let i = 0; i < 64; i++) {
                    const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
                    const ch = (e & f) ^ (~e & g);
                    const t1 = (h + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
                    const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const t2 = (S0 + maj) >>> 0;
                    h = g; g = f; f = e; e = (d + t1) >>> 0;
                    d = c; c = b; b = a; a = (t1 + t2) >>> 0;
                  }
                  h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0;
                  h4 = (h4 + e) >>> 0; h5 = (h5 + f) >>> 0; h6 = (h6 + g) >>> 0; h7 = (h7 + h) >>> 0;
                }
                const out = new Uint8Array(32);
                const odv = new DataView(out.buffer);
                [h0, h1, h2, h3, h4, h5, h6, h7].forEach((v, i) => odv.setUint32(i * 4, v, false));
                return out;
              }

              async function sha256Bytes(data) {
                if (window.crypto && window.crypto.subtle) {
                  try {
                    return new Uint8Array(await window.crypto.subtle.digest('SHA-256', data));
                  } catch (e) {}
                }
                return sha256PureJs(data instanceof Uint8Array ? data : new Uint8Array(data));
              }

              const AES_SBOX = new Uint8Array(256);
              const AES_XTIME = new Uint8Array(256);
              const AES_RCON = new Uint8Array([0x00,0x01,0x02,0x04,0x08,0x10,0x20,0x40,0x80,0x1b,0x36]);
              (function initAesTables() {
                const p = new Uint8Array(256), q = new Uint8Array(256);
                let x = 1;
                for (let i = 0; i < 255; i++) {
                  p[i] = x; q[x] = i;
                  x = (x ^ (x << 1) ^ ((x & 0x80) ? 0x11b : 0)) & 0xff;
                }
                AES_SBOX[0] = 0x63;
                for (let i = 1; i < 256; i++) {
                  let y = p[255 - q[i]];
                  let s = y;
                  for (let r = 0; r < 4; r++) {
                    y = ((y << 1) | (y >>> 7)) & 0xff;
                    s ^= y;
                  }
                  AES_SBOX[i] = (s ^ 0x63) & 0xff;
                }
                for (let i = 0; i < 256; i++) {
                  AES_XTIME[i] = ((i << 1) ^ ((i & 0x80) ? 0x11b : 0)) & 0xff;
                }
              })();

              function aes256ExpandKey(key32) {
                const w = new Uint8Array(240);
                w.set(key32, 0);
                let t0 = 0, t1 = 0, t2 = 0, t3 = 0, rconIdx = 1;
                for (let i = 32; i < 240; i += 4) {
                  t0 = w[i - 4]; t1 = w[i - 3]; t2 = w[i - 2]; t3 = w[i - 1];
                  if ((i & 31) === 0) {
                    const tmp = t0;
                    t0 = AES_SBOX[t1] ^ AES_RCON[rconIdx++];
                    t1 = AES_SBOX[t2];
                    t2 = AES_SBOX[t3];
                    t3 = AES_SBOX[tmp];
                  } else if ((i & 31) === 16) {
                    t0 = AES_SBOX[t0]; t1 = AES_SBOX[t1]; t2 = AES_SBOX[t2]; t3 = AES_SBOX[t3];
                  }
                  w[i] = w[i - 32] ^ t0;
                  w[i + 1] = w[i - 31] ^ t1;
                  w[i + 2] = w[i - 30] ^ t2;
                  w[i + 3] = w[i - 29] ^ t3;
                }
                return w;
              }

              // Zero-allocation fast AES-256-CTR loop
              function aes256CtrProcessFast(masterKey32, iv16, inputBuf) {
                const rk = aes256ExpandKey(masterKey32);
                const src = inputBuf instanceof Uint8Array ? inputBuf : new Uint8Array(inputBuf);
                const len = src.length;
                const out = new Uint8Array(len);
                const ctr = new Uint8Array(iv16);
                const s = new Uint8Array(16);
                const t = new Uint8Array(16);
                const ks = new Uint8Array(16);

                for (let off = 0; off < len; off += 16) {
                  for (let i = 0; i < 16; i++) s[i] = ctr[i] ^ rk[i];
                  for (let round = 1; round <= 14; round++) {
                    const roff = round << 4;
                    t[0] = AES_SBOX[s[0]]; t[1] = AES_SBOX[s[5]]; t[2] = AES_SBOX[s[10]]; t[3] = AES_SBOX[s[15]];
                    t[4] = AES_SBOX[s[4]]; t[5] = AES_SBOX[s[9]]; t[6] = AES_SBOX[s[14]]; t[7] = AES_SBOX[s[3]];
                    t[8] = AES_SBOX[s[8]]; t[9] = AES_SBOX[s[13]]; t[10] = AES_SBOX[s[2]]; t[11] = AES_SBOX[s[7]];
                    t[12] = AES_SBOX[s[12]]; t[13] = AES_SBOX[s[1]]; t[14] = AES_SBOX[s[6]]; t[15] = AES_SBOX[s[11]];
                    if (round < 14) {
                      for (let c = 0; c < 16; c += 4) {
                        const a0 = t[c], a1 = t[c + 1], a2 = t[c + 2], a3 = t[c + 3];
                        const x0 = AES_XTIME[a0], x1 = AES_XTIME[a1], x2 = AES_XTIME[a2], x3 = AES_XTIME[a3];
                        s[c] = x0 ^ x1 ^ a1 ^ a2 ^ a3 ^ rk[roff + c];
                        s[c + 1] = a0 ^ x1 ^ x2 ^ a2 ^ a3 ^ rk[roff + c + 1];
                        s[c + 2] = a0 ^ a1 ^ x2 ^ x3 ^ a3 ^ rk[roff + c + 2];
                        s[c + 3] = x0 ^ a0 ^ a1 ^ a2 ^ x3 ^ rk[roff + c + 3];
                      }
                    } else {
                      for (let i = 0; i < 16; i++) ks[i] = t[i] ^ rk[roff + i];
                    }
                  }
                  const rem = Math.min(16, len - off);
                  for (let i = 0; i < rem; i++) out[off + i] = src[off + i] ^ ks[i];
                  for (let c = 15; c >= 8; c--) {
                    const nxt = (ctr[c] + 1) & 0xff;
                    ctr[c] = nxt;
                    if (nxt !== 0) break;
                  }
                }
                return out.buffer;
              }

              async function aesCtrDecryptChunk(cryptoKey, masterKey32, nonce8, blockIndex, encBuf) {
                const iv = makeCtrIv(nonce8, blockIndex);
                if (cryptoKey && window.crypto && window.crypto.subtle) {
                  try {
                    return await window.crypto.subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 64 }, cryptoKey, encBuf);
                  } catch (e) {}
                }
                return aes256CtrProcessFast(masterKey32, iv, encBuf);
              }

              function makeCtrIv(nonce8, blockIndex) {
                const iv = new Uint8Array(16);
                iv.set(nonce8.slice(0, 8), 0);
                const dv = new DataView(iv.buffer);
                dv.setUint32(8, Math.floor(blockIndex / 4294967296), false);
                dv.setUint32(12, blockIndex >>> 0, false);
                return iv;
              }

              const B32_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
              function base32Encode(bytes) {
                let out = "", buf = 0, bits = 0;
                for (let i = 0; i < bytes.length; i++) {
                  buf = (buf << 8) | bytes[i];
                  bits += 8;
                  while (bits >= 5) {
                    out += B32_ALPHABET[(buf >>> (bits - 5)) & 31];
                    bits -= 5;
                  }
                }
                if (bits > 0) out += B32_ALPHABET[(buf << (5 - bits)) & 31];
                return out;
              }

              function base32Decode(str) {
                const out = [];
                let buf = 0, bits = 0;
                for (let i = 0; i < str.length; i++) {
                  const v = B32_ALPHABET.indexOf(str[i]);
                  if (v < 0) continue;
                  buf = (buf << 5) | v;
                  bits += 5;
                  if (bits >= 8) {
                    out.push((buf >>> (bits - 8)) & 255);
                    bits -= 8;
                  }
                }
                return new Uint8Array(out);
              }

              // Fast native Base64 decode without regex copying
              function b64ToBytesFast(b64) {
                const bin = atob(b64.trim());
                const len = bin.length;
                const out = new Uint8Array(len);
                for (let i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
                return out;
              }

              function blobToBase64(blob) {
                return new Promise((resolve, reject) => {
                  const reader = new FileReader();
                  reader.onload = () => {
                    const res = String(reader.result || '');
                    const comma = res.indexOf(',');
                    resolve(comma >= 0 ? res.slice(comma + 1) : res);
                  };
                  reader.onerror = reject;
                  reader.readAsDataURL(blob);
                });
              }

              async function deriveZkKdf(passwordStr) {
                const enc = new TextEncoder();
                const baseKey = await crypto.subtle.importKey('raw', enc.encode(passwordStr), 'PBKDF2', false, ['deriveBits']);
                const bits = await crypto.subtle.deriveBits(
                  { name: 'PBKDF2', salt: hexToBytes(ZK_SALT_HEX), iterations: 200000, hash: 'SHA-256' },
                  baseKey,
                  256
                );
                return new Uint8Array(bits);
              }

              // =========================================================================
              // SERVICE WORKER REGISTRATION (FOR ONLINE STREAMING)
              // =========================================================================
              if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
                navigator.serviceWorker.addEventListener('message', async (event) => {
                  const data = event.data;
                  if (!data || data.type !== 'VLOCK_STREAM_PULL') return;
                  const port = event.ports[0];
                  const sess = activeStreamSessions[data.sid];
                  if (!sess) {
                    port.postMessage({ ok: false });
                    return;
                  }
                  try {
                    const start = data.start;
                    const end = data.end;
                    const contentLen = (end - start) + 1;
                    const blockIndex = Math.floor(start / 16);
                    const byteSkip = start % 16;

                    const readStart = sess.payloadOffset + (blockIndex * 16);
                    const readEnd = Math.min(sess.file.size, readStart + contentLen + byteSkip + 16);
                    const encBuf = await sess.file.slice(readStart, readEnd).arrayBuffer();

                    const decFull = await aesCtrDecryptChunk(sess.cryptoKey, sess.masterKey, sess.nonce8, blockIndex, encBuf);
                    const sliced = decFull.slice(byteSkip, byteSkip + contentLen);
                    port.postMessage({ ok: true, buffer: sliced }, [sliced]);
                  } catch (err) {
                    port.postMessage({ ok: false });
                  }
                });
              }

              // =========================================================================
              // INSTANT 0.01s EMBEDDED .HTML DETECTION (NO UPFRONT DECODING ON PAGE LOAD!)
              // =========================================================================
              function detectEmbeddedVideoOnStartup() {
                const metaEl = document.getElementById('vlock-embedded-meta');
                const headerChunkEl = document.getElementById('vlock-b64-header');
                if (!metaEl || !headerChunkEl) return;

                hasEmbeddedDomChunks = true;
                embeddedFileName = metaEl.getAttribute('data-filename') || 'Encrypted_Video.html';
                embeddedTotalBytes = parseInt(metaEl.getAttribute('data-size') || '0', 10);
                const sizeMb = (embeddedTotalBytes / (1024 * 1024)).toFixed(1);

                // Hide Admin Panel & Tutorial when user opens an encrypted .html video file directly
                const adminCard = document.getElementById('adminEncryptionCard');
                if (adminCard) adminCard.style.display = 'none';

                document.getElementById('viewerFileTitle').textContent = `Ready to Unlock: ${embeddedFileName} (${sizeMb} MB)`;
                document.getElementById('instantKeyModalFileLabel').textContent = `🎬 Ready to Play: ${embeddedFileName} (${sizeMb} MB)`;
                document.getElementById('instantKeyModal').classList.add('show');
                setTimeout(() => {
                  const modalInput = document.getElementById('modalViewerKeyInput');
                  if (modalInput) modalInput.focus();
                }, 50);
              }

              // Support picking either a .html encrypted file or legacy file via the file picker
              async function extractFileFromPickedHtml(file) {
                const headProbe = new TextDecoder().decode(await file.slice(0, 1024).arrayBuffer());
                if (headProbe.includes('<!DOCTYPE html>') || headProbe.includes('vlock-b64-')) {
                  const fullText = await file.text();
                  const parts = [];
                  const headMatch = /<script[^>]*id="vlock-b64-header"[^>]*>([\s\S]*?)<\/script>/.exec(fullText);
                  if (headMatch) parts.push(new Blob([b64ToBytesFast(headMatch[1])]));

                  const regex = /<script[^>]*class="vlock-b64-chunk"[^>]*>([\s\S]*?)<\/script>/g;
                  let match;
                  while ((match = regex.exec(fullText)) !== null) {
                    parts.push(new Blob([b64ToBytesFast(match[1])]));
                  }
                  if (parts.length > 0) {
                    const outBlob = new Blob(parts, { type: 'application/octet-stream' });
                    outBlob.name = file.name;
                    return outBlob;
                  }
                }
                return file;
              }

              async function onVlockFilePicked(file, showPopup = true) {
                if (!file) return;
                hasEmbeddedDomChunks = false;
                selectedVlockFile = await extractFileFromPickedHtml(file);
                const displayName = file.name || 'Encrypted_Video.html';
                const sizeMb = (selectedVlockFile.size / (1024 * 1024)).toFixed(1);
                document.getElementById('viewerFileTitle').textContent = `Ready to Unlock: ${displayName} (${sizeMb} MB)`;

                if (showPopup) {
                  document.getElementById('instantKeyModalFileLabel').textContent = `🎬 Ready to Play: ${displayName} (${sizeMb} MB)`;
                  document.getElementById('instantKeyModal').classList.add('show');
                  setTimeout(() => {
                    const modalInput = document.getElementById('modalViewerKeyInput');
                    if (modalInput) modalInput.focus();
                  }, 50);
                }
              }

              function onRawMediaPicked(file) {
                if (!file) return;
                selectedRawMediaFile = file;
                const sizeMb = (file.size / (1024 * 1024)).toFixed(1);
                document.getElementById('encryptFileTitle').textContent = `Selected: ${file.name} (${sizeMb} MB)`;
              }

              function bindDropZone(zoneId, inputId, callback) {
                const zone = document.getElementById(zoneId);
                const input = document.getElementById(inputId);
                zone.addEventListener('click', () => input.click());
                input.addEventListener('change', () => {
                  if (input.files && input.files.length > 0) callback(input.files[0]);
                });
                zone.addEventListener('dragover', (e) => {
                  e.preventDefault();
                  zone.classList.add('dragover');
                });
                zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
                zone.addEventListener('drop', (e) => {
                  e.preventDefault();
                  zone.classList.remove('dragover');
                  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    callback(e.dataTransfer.files[0]);
                  }
                });
              }

              async function pasteIntoField(inputId) {
                const el = document.getElementById(inputId);
                el.focus();
                try {
                  if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                      el.value = text.trim();
                      return;
                    }
                  }
                } catch (e) {}
                const manual = prompt("Paste your key here:");
                if (manual !== null && manual.trim() !== "") {
                  el.value = manual.trim();
                }
              }

              async function copyTextSafe(text, msg) {
                try {
                  await navigator.clipboard.writeText(text);
                  alert(msg || "Copied to clipboard!");
                } catch (e) {
                  prompt("Copy this text:", text);
                }
              }

              async function handleSuperuserLogin() {
                const pwd = document.getElementById('suPasswordInput').value;
                if (!pwd) {
                  alert("Please enter the Superuser Password.");
                  return;
                }
                const btn = document.getElementById('btnLoginSu');
                btn.disabled = true;
                btn.textContent = "Verifying...";
                try {
                  const kdf = await deriveZkKdf(pwd);
                  const check = await sha256Bytes(concatBytes(kdf, new TextEncoder().encode("VLOCK_SU_AUTH_v2")));
                  if (bytesToHex(check).toLowerCase() === ZK_VERIFIER_HEX.toLowerCase()) {
                    verifiedSuPassword = pwd;
                    document.getElementById('suLoginBox').style.display = 'none';
                    document.getElementById('suGeneratorBox').style.display = 'flex';
                  } else {
                    alert("Incorrect Superuser Password!");
                  }
                } catch (err) {
                  alert("Login error: " + err.message);
                } finally {
                  btn.disabled = false;
                  btn.textContent = "Login";
                }
              }

              async function handleGenerateSessionKey() {
                try {
                  const code = document.getElementById('suDurationSelect').value;
                  const salt = hexToBytes(ZK_SALT_HEX);
                  const kdf = await deriveZkKdf(verifiedSuPassword);
                  const encD = hexToBytes(ZK_ENC_D_HEX);

                  const aesKey = await crypto.subtle.importKey('raw', kdf, 'AES-CTR', false, ['decrypt']);
                  const iv = new Uint8Array(16);
                  iv.set(salt.slice(0, 8), 0);
                  const dRaw = await crypto.subtle.decrypt({ name: 'AES-CTR', counter: iv, length: 64 }, aesKey, encD);
                  const dB64u = bytesToBase64Url(dRaw);

                  const jwkPriv = {
                    kty: "EC",
                    crv: "P-256",
                    x: ZK_PUB_X_B64U,
                    y: ZK_PUB_Y_B64U,
                    d: dB64u,
                    ext: true
                  };

                  const ecPrivKey = await crypto.subtle.importKey(
                    'jwk',
                    jwkPriv,
                    { name: 'ECDSA', namedCurve: 'P-256' },
                    false,
                    ['sign']
                  );

                  const rnd = crypto.getRandomValues(new Uint8Array(4));
                  const nonce = bytesToHex(rnd).toUpperCase();
                  const msg = `VLKS-${code}-${nonce}`;
                  const rawSig = new Uint8Array(await crypto.subtle.sign(
                    { name: 'ECDSA', hash: 'SHA-256' },
                    ecPrivKey,
                    new TextEncoder().encode(msg)
                  ));

                  const fullKey = `${msg}-${base32Encode(rawSig)}`;
                  document.getElementById('suGeneratedKeyOut').value = fullKey;
                  copyTextSafe(fullKey, "Session Key generated and copied to clipboard!");
                } catch (err) {
                  alert("Error generating Session Key: " + err.message);
                }
              }

              async function handleActivateSessionKey() {
                try {
                  const raw = document.getElementById('sessionKeyInput').value.trim().toUpperCase();
                  if (!raw) {
                    alert("Please paste a Session Key first.");
                    return;
                  }
                  const parts = raw.split('-');
                  if (parts.length !== 4 || parts[0] !== 'VLKS') {
                    throw new Error("Invalid Session Key format. Expected VLKS-XXXX-XXXXXXXX-...");
                  }
                  const [_, code, nonce, sigB32] = parts;
                  if (!(code in CODE_TO_SECONDS)) {
                    throw new Error("Unknown duration code in Session Key.");
                  }

                  const rawSig = base32Decode(sigB32);
                  const jwkPub = {
                    kty: "EC",
                    crv: "P-256",
                    x: ZK_PUB_X_B64U,
                    y: ZK_PUB_Y_B64U,
                    ext: true
                  };

                  const pubKey = await crypto.subtle.importKey(
                    'jwk',
                    jwkPub,
                    { name: 'ECDSA', namedCurve: 'P-256' },
                    false,
                    ['verify']
                  );

                  const valid = await crypto.subtle.verify(
                    { name: 'ECDSA', hash: 'SHA-256' },
                    pubKey,
                    rawSig,
                    new TextEncoder().encode(`VLKS-${code}-${nonce}`)
                  );
                  if (!valid) {
                    throw new Error("Invalid or forged Session Key signature.");
                  }

                  const usedNonces = JSON.parse(localStorage.getItem('vlock_used_nonces') || '[]');
                  if (usedNonces.includes(nonce)) {
                    throw new Error("This Session Key has already been used on this device.");
                  }
                  usedNonces.push(nonce);
                  localStorage.setItem('vlock_used_nonces', JSON.stringify(usedNonces));

                  const secs = CODE_TO_SECONDS[code];
                  const expiry = secs === -1 ? -1 : Math.floor(Date.now() / 1000) + secs;
                  localStorage.setItem('vlock_admin_expiry', String(expiry));
                  localStorage.setItem('vlock_admin_plan', CODE_TO_LABEL[code]);

                  document.getElementById('sessionKeyInput').value = '';
                  refreshAdminLockUI();
                  alert("Admin Encryption Panel unlocked for: " + CODE_TO_LABEL[code]);
                } catch (err) {
                  alert(err.message);
                }
              }

              function refreshAdminLockUI() {
                let expiry = 0, plan = '';
                try {
                  expiry = parseInt(localStorage.getItem('vlock_admin_expiry') || '0', 10);
                  plan = localStorage.getItem('vlock_admin_plan') || '';
                } catch (e) {}
                const now = Math.floor(Date.now() / 1000);
                const badge = document.getElementById('adminStatusBadge');
                const lockedSec = document.getElementById('adminLockedSection');
                const unlockedSec = document.getElementById('adminUnlockedSection');

                if (expiry === -1) {
                  badge.textContent = "Unlocked • Lifetime Access";
                  badge.style.color = "#3fb950";
                  lockedSec.style.display = 'none';
                  unlockedSec.style.display = 'flex';
                } else if (expiry > now) {
                  const rem = expiry - now;
                  const d = Math.floor(rem / 86400);
                  const h = Math.floor((rem % 86400) / 3600);
                  badge.textContent = `Unlocked • ${plan} (${d}d ${h}h left)`;
                  badge.style.color = "#3fb950";
                  lockedSec.style.display = 'none';
                  unlockedSec.style.display = 'flex';
                } else {
                  badge.textContent = "Locked • Session Key Required";
                  badge.style.color = "#ffa198";
                  lockedSec.style.display = 'flex';
                  unlockedSec.style.display = 'none';
                }
              }

              // Browser-safe MIME type so hardware video decoders never show a black screen
              function resolvePlaybackMimeType(ext) {
                const e = ext.toLowerCase();
                if (e === '.webm') return 'video/webm';
                if (e === '.ogg') return 'audio/ogg';
                if (e === '.mp3') return 'audio/mpeg';
                if (e === '.flac') return 'audio/flac';
                if (e === '.wav') return 'audio/wav';
                if (e === '.aac') return 'audio/aac';
                if (e === '.m4a') return 'audio/mp4';
                return 'video/mp4';
              }

              // =========================================================================
              // STREAMING PLATFORM FULLSCREEN & LANDSCAPE ROTATION ENGINE
              // =========================================================================
              async function toggleCinemaFullScreen() {
                const playerWrap = document.getElementById('playerWrap');
                const videoEl = document.getElementById('vlockVideoPlayer');

                const isNativeFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
                const isCssFs = playerWrap.classList.contains('cinema-fullscreen') || playerWrap.classList.contains('force-landscape');

                if (isNativeFs || isCssFs) {
                  if (document.exitFullscreen && document.fullscreenElement) {
                    await document.exitFullscreen().catch(() => {});
                  } else if (document.webkitExitFullscreen && document.webkitFullscreenElement) {
                    document.webkitExitFullscreen();
                  }
                  playerWrap.classList.remove('cinema-fullscreen', 'force-landscape');
                  if (screen.orientation && screen.orientation.unlock) {
                    try { screen.orientation.unlock(); } catch (e) {}
                  }
                  return;
                }

                try {
                  if (playerWrap.requestFullscreen) {
                    await playerWrap.requestFullscreen();
                  } else if (playerWrap.webkitRequestFullscreen) {
                    playerWrap.webkitRequestFullscreen();
                  } else if (videoEl.webkitEnterFullscreen) {
                    videoEl.webkitEnterFullscreen();
                    return;
                  } else {
                    playerWrap.classList.add('cinema-fullscreen');
                  }
                  if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape').catch(() => {});
                  }
                } catch (e) {
                  // Fallback for Android content:// / WebView where native requestFullscreen is blocked
                  playerWrap.classList.add('cinema-fullscreen');
                }
              }

              function toggleForceLandscape() {
                const playerWrap = document.getElementById('playerWrap');
                if (playerWrap.classList.contains('force-landscape')) {
                  playerWrap.classList.remove('force-landscape');
                } else {
                  playerWrap.classList.remove('cinema-fullscreen');
                  playerWrap.classList.add('force-landscape');
                }
              }

              async function startVideoElementSafely(videoEl, srcUrl) {
                return new Promise((resolve) => {
                  const onReady = () => {
                    videoEl.removeEventListener('loadedmetadata', onReady);
                    videoEl.removeEventListener('error', onReady);
                    videoEl.play().catch(() => {});
                    resolve();
                  };
                  videoEl.addEventListener('loadedmetadata', onReady, { once: true });
                  videoEl.addEventListener('error', onReady, { once: true });
                  videoEl.src = srcUrl;
                  videoEl.load();
                });
              }

              // =========================================================================
              // MEMORY-SAFE DECRYPTION & PLAYBACK (BOTH EMBEDDED .HTML & PICKED FILES)
              // =========================================================================
              async function handleDecryptAndWatch() {
                if (!hasEmbeddedDomChunks && !selectedVlockFile) {
                  alert("Please select an encrypted .html video file first.");
                  return;
                }
                const rawKey = document.getElementById('viewerKeyInput').value.trim().toUpperCase();
                if (!rawKey) {
                  alert("Please paste your One-Time Key or Permanent Masterkey.");
                  return;
                }

                const btn = document.getElementById('btnDecryptWatch');
                const modalBtn = document.getElementById('btnModalDecryptWatch');
                btn.disabled = true;
                if (modalBtn) modalBtn.disabled = true;

                try {
                  const enc = new TextEncoder();
                  const kBytes = enc.encode(rawKey);
                  const targetKeyId = (await sha256Bytes(kBytes)).slice(0, 15);
                  const wrapMask = await sha256Bytes(concatBytes(kBytes, enc.encode("VLOCK_WRAP")));

                  let headerAndSlotsBytes = null;
                  if (hasEmbeddedDomChunks) {
                    const headerScript = document.getElementById('vlock-b64-header');
                    if (!headerScript) throw new Error("Video stream already consumed. Reload page to watch with a new key.");
                    headerAndSlotsBytes = b64ToBytesFast(headerScript.textContent);
                  } else {
                    const probeLen = Math.min(selectedVlockFile.size, 5000000);
                    headerAndSlotsBytes = new Uint8Array(await selectedVlockFile.slice(0, probeLen).arrayBuffer());
                  }

                  let vlockStart = -1;
                  const maxScan = Math.min(headerAndSlotsBytes.length - 6, 8192);
                  for (let i = 0; i <= maxScan; i++) {
                    const ver = (headerAndSlotsBytes[i + 4] << 8) | headerAndSlotsBytes[i + 5];
                    if (
                      headerAndSlotsBytes[i] === 0x56 &&
                      headerAndSlotsBytes[i + 1] === 0x4C &&
                      headerAndSlotsBytes[i + 2] === 0x43 &&
                      headerAndSlotsBytes[i + 3] === 0x4B &&
                      (ver === 1 || ver === 2)
                    ) {
                      vlockStart = i;
                      break;
                    }
                  }
                  if (vlockStart === -1) {
                    throw new Error("Not a valid VLock encrypted video file.");
                  }

                  const headSlice = headerAndSlotsBytes.slice(vlockStart, vlockStart + 66);
                  const dv = new DataView(headSlice.buffer, headSlice.byteOffset, headSlice.byteLength);
                  const version = dv.getUint16(4, false);
                  let ext = ".mp4", nonce8, verifyHash, numKeys, fixedLen;

                  if (version === 1) {
                    ext = new TextDecoder().decode(headSlice.slice(6, 14)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headSlice.slice(14, 22);
                    verifyHash = headSlice.slice(22, 54);
                    numKeys = dv.getUint32(54, false);
                    fixedLen = 58;
                  } else if (version === 2) {
                    ext = new TextDecoder().decode(headSlice.slice(6, 22)).replace(/\0/g, '').trim() || ".mp4";
                    nonce8 = headSlice.slice(22, 30);
                    verifyHash = headSlice.slice(30, 62);
                    numKeys = dv.getUint32(62, false);
                    fixedLen = 66;
                  } else {
                    throw new Error("Unsupported format version: " + version);
                  }

                  const slotsStart = vlockStart + fixedLen;
                  const payloadOffset = slotsStart + (numKeys * SLOT_SIZE);
                  const slotsData = headerAndSlotsBytes.slice(slotsStart, payloadOffset);

                  let matchedIdx = -1, slotStatus = 0, wrappedMk = null;
                  for (let i = 0; i < numKeys; i++) {
                    const off = i * SLOT_SIZE;
                    let same = true;
                    for (let b = 0; b < 15; b++) {
                      if (slotsData[off + 1 + b] !== targetKeyId[b]) { same = false; break; }
                    }
                    if (same) {
                      matchedIdx = i;
                      slotStatus = slotsData[off];
                      wrappedMk = slotsData.slice(off + 16, off + 48);
                      break;
                    }
                  }

                  if (matchedIdx === -1) {
                    throw new Error("Invalid Decryption Key! Please check the key from the Telegram Bot.");
                  }

                  const keyHex = bytesToHex(targetKeyId);
                  let burnedKeys = {};
                  try { burnedKeys = JSON.parse(localStorage.getItem('vlock_burned_keys') || '{}'); } catch (e) {}
                  if (slotStatus === 0 || (slotStatus === 1 && burnedKeys[keyHex])) {
                    throw new Error("Previous key expired! Please enter a new key from the Telegram Bot to watch again.");
                  }

                  const masterKey = new Uint8Array(32);
                  for (let i = 0; i < 32; i++) masterKey[i] = wrappedMk[i] ^ wrapMask[i];

                  const checkHash = await sha256Bytes(concatBytes(masterKey, enc.encode("VLOCK_VERIFY")));
                  if (bytesToHex(checkHash) !== bytesToHex(verifyHash)) {
                    throw new Error("Key verification failed.");
                  }

                  let cryptoKey = null;
                  if (window.crypto && window.crypto.subtle) {
                    try {
                      cryptoKey = await window.crypto.subtle.importKey('raw', masterKey, 'AES-CTR', false, ['decrypt']);
                    } catch (e) {}
                  }

                  // Burn one-time key after verification
                  if (slotStatus === 1) {
                    burnedKeys[keyHex] = Date.now();
                    try { localStorage.setItem('vlock_burned_keys', JSON.stringify(burnedKeys)); } catch (e) {}
                  }

                  const mime = resolvePlaybackMimeType(ext);
                  const decBlobParts = [];

                  if (hasEmbeddedDomChunks) {
                    // Decrypt embedded DOM chunks one-by-one and immediately free each script tag to save 65% GPU/RAM
                    const chunkNodes = Array.from(document.querySelectorAll('script.vlock-b64-chunk'));
                    const totalChunks = chunkNodes.length;
                    let byteOffset = 0;

                    for (let idx = 0; idx < totalChunks; idx++) {
                      const pct = Math.round(((idx + 1) / totalChunks) * 100);
                      const msg = `Unlocking Video... ${pct}%`;
                      btn.textContent = msg;
                      if (modalBtn) modalBtn.textContent = msg;
                      await new Promise(r => setTimeout(r, 0));

                      const node = chunkNodes[idx];
                      const encBytes = b64ToBytesFast(node.textContent);
                      node.textContent = '';
                      node.remove();

                      const decBuf = await aesCtrDecryptChunk(cryptoKey, masterKey, nonce8, Math.floor(byteOffset / 16), encBytes);
                      decBlobParts.push(new Blob([decBuf]));
                      byteOffset += encBytes.byteLength;
                    }
                    hasEmbeddedDomChunks = false;
                  } else {
                    const payloadSize = selectedVlockFile.size - payloadOffset;
                    // Use instant Service Worker range streaming if online & not restoring permanent masterkey
                    if (slotStatus !== 2 && cryptoKey && navigator.serviceWorker && navigator.serviceWorker.controller) {
                      document.getElementById('instantKeyModal').classList.remove('show');
                      closePlayerStream();
                      document.getElementById('playerWrap').classList.add('active');
                      document.getElementById('nowPlayingLabel').textContent = "Now Playing: " + (selectedVlockFile.name || 'Decrypted Video');
                      const videoEl = document.getElementById('vlockVideoPlayer');
                      const sid = Math.random().toString(36).slice(2) + Date.now().toString(36);
                      activeStreamSessions[sid] = { file: selectedVlockFile, cryptoKey, masterKey, nonce8, payloadOffset, payloadSize };
                      await startVideoElementSafely(videoEl, `./__vlock_stream__/Episode.mp4?sid=${sid}&size=${payloadSize}&mime=${encodeURIComponent(mime)}`);
                      document.getElementById('playerWrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
                      return;
                    }

                    const chunkSize = 8 * 1024 * 1024;
                    let offset = 0;
                    while (offset < payloadSize) {
                      const pct = Math.min(100, Math.round((offset / payloadSize) * 100));
                      const msg = `Unlocking Video... ${pct}%`;
                      btn.textContent = msg;
                      if (modalBtn) modalBtn.textContent = msg;
                      await new Promise(r => setTimeout(r, 0));

                      const len = Math.min(chunkSize, payloadSize - offset);
                      const encChunk = await selectedVlockFile.slice(payloadOffset + offset, payloadOffset + offset + len).arrayBuffer();
                      const decChunk = await aesCtrDecryptChunk(cryptoKey, masterKey, nonce8, Math.floor(offset / 16), encChunk);
                      decBlobParts.push(new Blob([decChunk]));
                      offset += len;
                    }
                  }

                  document.getElementById('instantKeyModal').classList.remove('show');
                  const finalVideoBlob = new Blob(decBlobParts, { type: mime });

                  if (slotStatus === 2) {
                    const baseTitle = (embeddedFileName || (selectedVlockFile && selectedVlockFile.name) || 'Video').replace(/\.(html|htm|vlock)$/i, '');
                    const outName = `${baseTitle}_Unlocked${ext}`;
                    await saveBlobToDisk(finalVideoBlob, outName);
                    alert("Permanent Masterkey Verified!\n\nVideo unlocked forever and restored to its original format: " + outName);
                    return;
                  }

                  closePlayerStream();
                  document.getElementById('playerWrap').classList.add('active');
                  document.getElementById('nowPlayingLabel').textContent = "Now Playing: " + (embeddedFileName || (selectedVlockFile && selectedVlockFile.name) || 'Decrypted Video');
                  const videoEl = document.getElementById('vlockVideoPlayer');
                  currentObjectUrl = URL.createObjectURL(finalVideoBlob);
                  await startVideoElementSafely(videoEl, currentObjectUrl);
                  document.getElementById('playerWrap').scrollIntoView({ behavior: 'smooth', block: 'center' });
                } catch (err) {
                  alert(err.message);
                } finally {
                  btn.disabled = false;
                  btn.textContent = "▶ Decrypt & Watch / Unlock";
                  if (modalBtn) {
                    modalBtn.disabled = false;
                    modalBtn.textContent = "▶ Decrypt & Watch Now";
                  }
                }
              }

              function closePlayerStream() {
                const playerWrap = document.getElementById('playerWrap');
                playerWrap.classList.remove('cinema-fullscreen', 'force-landscape');
                if (document.fullscreenElement && document.exitFullscreen) {
                  document.exitFullscreen().catch(() => {});
                }
                const videoEl = document.getElementById('vlockVideoPlayer');
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load();
                if (currentObjectUrl) {
                  URL.revokeObjectURL(currentObjectUrl);
                  currentObjectUrl = null;
                }
                activeStreamSessions = {};
                playerWrap.classList.remove('active');
              }

              async function saveBlobToDisk(blob, filename) {
                if (customDirectoryHandle) {
                  try {
                    const fh = await customDirectoryHandle.getFileHandle(filename, { create: true });
                    const wr = await fh.createWritable();
                    await wr.write(blob);
                    await wr.close();
                    return;
                  } catch (e) {}
                }
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
              }

              function generateHumanKey(prefix) {
                const alpha = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
                const rnd = crypto.getRandomValues(new Uint8Array(12));
                let g1 = "", g2 = "", g3 = "";
                for (let i = 0; i < 4; i++) {
                  g1 += alpha[rnd[i] % alpha.length];
                  g2 += alpha[rnd[i + 4] % alpha.length];
                  g3 += alpha[rnd[i + 8] % alpha.length];
                }
                return `${prefix}-${g1}-${g2}-${g3}`;
              }

              // =========================================================================
              // FAST .HTML SELF-OPENING VIDEO ENCRYPTION ENGINE
              // =========================================================================
              async function handleStartEncryption() {
                refreshAdminLockUI();
                if (document.getElementById('adminUnlockedSection').style.display === 'none') {
                  alert("Admin Encryption Panel is locked.");
                  return;
                }
                if (!selectedRawMediaFile) {
                  alert("Please select or drag & drop a video or audio file first.");
                  return;
                }

                const numTempKeys = parseInt(document.getElementById('numTempKeysInput').value || '0', 10);
                const includePerm = document.getElementById('permMasterCheckbox').checked;

                if (isNaN(numTempKeys) || numTempKeys < 0 || numTempKeys > 100000) {
                  alert("Enter a valid number of Temporary Keys (0 to 100000).");
                  return;
                }
                if (numTempKeys === 0 && !includePerm) {
                  alert("Temporary Keys is 0 and Permanent Masterkey is unchecked.\n\nPlease set Temporary Keys > 0 or check 'Permanent Masterkey' (or both).");
                  return;
                }

                const btn = document.getElementById('btnStartEncrypt');
                const statusEl = document.getElementById('encryptStatusText');
                const progEl = document.getElementById('encryptProgressFill');
                btn.disabled = true;
                progEl.style.width = '0%';
                statusEl.textContent = "Step 1/2: Generating keys instantly...";

                try {
                  const enc = new TextEncoder();
                  const dotIdx = selectedRawMediaFile.name.lastIndexOf('.');
                  const ext = (dotIdx >= 0 ? selectedRawMediaFile.name.slice(dotIdx).toLowerCase() : '.mp4').slice(0, 16);
                  const stem = dotIdx > 0 ? selectedRawMediaFile.name.slice(0, dotIdx) : selectedRawMediaFile.name;

                  const extBytes16 = new Uint8Array(16);
                  extBytes16.set(enc.encode(ext).slice(0, 16), 0);

                  const masterKey = crypto.getRandomValues(new Uint8Array(32));
                  const nonce8 = crypto.getRandomValues(new Uint8Array(8));
                  const verifyHash = await sha256Bytes(concatBytes(masterKey, enc.encode("VLOCK_VERIFY")));

                  const totalSlots = numTempKeys + (includePerm ? 1 : 0);
                  const slotsBuffer = new Uint8Array(totalSlots * SLOT_SIZE);
                  const keyLines = [];
                  let slotIdx = 0;

                  if (includePerm) {
                    const pkStr = generateHumanKey("VLOCK-MASTER");
                    keyLines.push("=== PERMANENT MASTERKEY (UNLOCKS FOREVER & RESTORES ORIGINAL VIDEO) ===", pkStr, "");
                    const pkBytes = enc.encode(pkStr);
                    const pkId = (await sha256Bytes(pkBytes)).slice(0, 15);
                    const pkMask = await sha256Bytes(concatBytes(pkBytes, enc.encode("VLOCK_WRAP")));
                    const off = slotIdx * SLOT_SIZE;
                    slotsBuffer[off] = 2;
                    slotsBuffer.set(pkId, off + 1);
                    for (let b = 0; b < 32; b++) slotsBuffer[off + 16 + b] = masterKey[b] ^ pkMask[b];
                    slotIdx++;
                  }

                  if (numTempKeys > 0) {
                    if (includePerm) keyLines.push(`=== ONE-TIME TEMPORARY KEYS (${numTempKeys}) ===`);
                    for (let i = 0; i < numTempKeys; i++) {
                      const kStr = generateHumanKey("VLOCK");
                      keyLines.push(kStr);
                      const kBytes = enc.encode(kStr);
                      const kId = (await sha256Bytes(kBytes)).slice(0, 15);
                      const kMask = await sha256Bytes(concatBytes(kBytes, enc.encode("VLOCK_WRAP")));
                      const off = slotIdx * SLOT_SIZE;
                      slotsBuffer[off] = 1;
                      slotsBuffer.set(kId, off + 1);
                      for (let b = 0; b < 32; b++) slotsBuffer[off + 16 + b] = masterKey[b] ^ kMask[b];
                      slotIdx++;
                    }
                  }

                  lastGeneratedKeysContent = keyLines.join('\n') + '\n';
                  document.getElementById('keysTextarea').value = lastGeneratedKeysContent;
                  document.getElementById('keysOutputBox').classList.add('show');
                  await saveBlobToDisk(new Blob([lastGeneratedKeysContent], { type: 'text/plain;charset=utf-8' }), 'bot_keys.txt');

                  const headerFixed = new Uint8Array(66);
                  headerFixed.set(enc.encode("VLCK"), 0);
                  const hDv = new DataView(headerFixed.buffer);
                  hDv.setUint16(4, 2, false);
                  headerFixed.set(extBytes16, 6);
                  headerFixed.set(nonce8, 22);
                  headerFixed.set(verifyHash, 30);
                  hDv.setUint32(62, totalSlots, false);

                  const cryptoKey = await crypto.subtle.importKey('raw', masterKey, 'AES-CTR', false, ['encrypt']);

                  // Build clean self-opening .html template
                  const pageClone = document.documentElement.cloneNode(true);
                  pageClone.querySelectorAll('script.vlock-b64-chunk, #vlock-b64-header, #vlock-embedded-meta').forEach(e => e.remove());
                  const cleanDocHtml = "<!DOCTYPE html>\n" + pageClone.outerHTML;
                  const bodyCloseIdx = cleanDocHtml.lastIndexOf('</body>');
                  const htmlPrefix = cleanDocHtml.slice(0, bodyCloseIdx);
                  const htmlSuffix = cleanDocHtml.slice(bodyCloseIdx);

                  const outHtmlFileName = `${stem}.html`;
                  const safeNameAttr = outHtmlFileName.replace(/"/g, '&quot;');
                  const totalSize = selectedRawMediaFile.size;

                  const htmlBlobParts = [
                    new Blob([htmlPrefix]),
                    new Blob([`\n<div id="vlock-embedded-meta" data-filename="${safeNameAttr}" data-size="${totalSize}" style="display:none"></div>\n`])
                  ];

                  // Separate small header script for instant 1ms key verification
                  const headAndSlotsB64 = await blobToBase64(new Blob([headerFixed, slotsBuffer]));
                  htmlBlobParts.push(new Blob([`<script type="text/plain" id="vlock-b64-header">${headAndSlotsB64}<\/script>\n`]));

                  // 8 MB fast encryption chunks
                  const chunkSize = 8 * 1024 * 1024;
                  let offset = 0;

                  while (offset < totalSize) {
                    const len = Math.min(chunkSize, totalSize - offset);
                    const plainSlice = await selectedRawMediaFile.slice(offset, offset + len).arrayBuffer();
                    const encSlice = await crypto.subtle.encrypt(
                      { name: 'AES-CTR', counter: makeCtrIv(nonce8, Math.floor(offset / 16)), length: 64 },
                      cryptoKey,
                      plainSlice
                    );
                    const chunkB64 = await blobToBase64(new Blob([encSlice]));
                    htmlBlobParts.push(new Blob([`<script type="text/plain" class="vlock-b64-chunk">${chunkB64}<\/script>\n`]));

                    offset += len;
                    const pct = Math.min(100, Math.round((offset / totalSize) * 100));
                    progEl.style.width = pct + '%';
                    statusEl.textContent = `Step 2/2: Encrypting into self-opening ${outHtmlFileName}... ${pct}% (0 MB internet used)`;
                  }

                  htmlBlobParts.push(new Blob([htmlSuffix]));

                  await saveBlobToDisk(new Blob(htmlBlobParts, { type: 'text/html;charset=utf-8' }), outHtmlFileName);
                  statusEl.textContent = `Done! Saved ${outHtmlFileName} & bot_keys.txt to your device.`;
                } catch (err) {
                  alert("Encryption error: " + err.message);
                  statusEl.textContent = "Error: " + err.message;
                } finally {
                  btn.disabled = false;
                }
              }

