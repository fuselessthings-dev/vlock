                document.getElementById('tabBtnUser').addEventListener('click', () => switchTutorialTab('user'));
                document.getElementById('tabBtnAdmin').addEventListener('click', () => switchTutorialTab('admin'));
                document.getElementById('tabBtnSession').addEventListener('click', () => switchTutorialTab('session'));

                const scrollToTut = () => {
