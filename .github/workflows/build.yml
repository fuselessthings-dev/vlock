                document.getElementById('btnActivateSession').addEventListener('click', handleActivateSessionKey);
                document.getElementById('btnDecryptWatch').addEventListener('click', handleDecryptAndWatch);
                document.getElementById('btnStartEncrypt').addEventListener('click', handleStartEncryption);

                document.getElementById('btnCopyBotKeys').addEventListener('click', () => {
                  if (lastGeneratedKeysContent) copyTextSafe(lastGeneratedKeysContent, "All generated keys copied to clipboard!");
                });
                document.getElementById('btnDownloadBotKeys').addEventListener('click', () => {
                  if (lastGeneratedKeysContent) {
                    saveBlobToDisk(new Blob([lastGeneratedKeysContent], { type: 'text/plain;charset=utf-8' }), 'bot_keys.txt');
                  }
                });

                document.getElementById('btnChangeSavePath').addEventListener('click', async () => {
                  if (window.showDirectoryPicker) {
                    try {
                      customDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
